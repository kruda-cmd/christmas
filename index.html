 id=\"pcPreview\">' + tradCard(myTeam(), currentFinal()) + '\u003c/div>\u003c/div>\u003c/section>';\n};\nfunction currentFinal() { const f = Object.assign({}, FIN[ME.teamId] || {}); FIELDS.forEach(x => { if (DRAFT['f_' + x[0]] !== undefined) f[x[0]] = DRAFT['f_' + x[0]]; }); return f; }\nlet finTimer = null;\nfunction finalInput() {\n  $('#pcPreview').innerHTML = tradCard(myTeam(), currentFinal());\n  clearTimeout(finTimer);\n  $('#savedNote').textContent = 'Зберігаємо…';\n  finTimer = setTimeout(() => call('saveFinal', ME.teamId, currentFinal()).then(() => { const n = $('#savedNote'); if (n) n.textContent = '✓ Збережено · ' + new Date().toLocaleTimeString('uk-UA'); }), 1200);\n}\nfunction pickEmoji(e) { const el = document.querySelector('[data-draft=\"f_symbol\"]'); el.value = e + ' ' + el.value.replace(/^\\S+\\s*/, m => EMOJI.indexOf(m.trim()) >= 0 ? '' : m); DRAFT.f_symbol = el.value; finalInput(); }\n\n/* Фото штаб-квартири на фоні фінальних екранів */\nfunction bgWrap(html) { return '\u003cdiv style=\"min-height:100%;background:linear-gradient(180deg,rgba(12,24,36,.82),rgba(12,24,36,.97) 60%),url(' + CFG.settings.finalPhoto + ') center top/cover\">' + html + '\u003c/div>'; }\n\n/* ---------- Голосування ---------- */\nSOFT.gallery = () => {\n  const cnt = {}; Object.keys(VOTES).forEach(k => cnt[VOTES[k]] = (cnt[VOTES[k]] || 0) + 1);\n  const mine = VOTES[ME.playerId];\n  return S.teams.map(t => tradCard(t, FIN[t.id], '\u003cdiv class=\"vote-bar\" style=\"position:relative;z-index:2;padding-right:110px\">'\n    + (IS_PLAYER ? (t.id === ME.teamId ? '\u003cspan class=\"hint\" style=\"color:#6b5d48\">Це ваша традиція\u003c/span>' : '\u003cbutton class=\"btn ' + (mine === t.id ? 'gold' : 'burg') + '\" onclick=\"vote(\\'' + t.id + '\\')\">' + (mine === t.id ? '❤ Ваш голос' : 'Голосую ❤') + '\u003c/button>')\n      : '\u003cspan class=\"votes\" style=\"color:var(--burg)\">❤ ' + (cnt[t.id] || 0) + '\u003c/span>') + '\u003c/div>')).join('');\n};\nV.voting = () => bgWrap('\u003csection class=\"page\">\u003cdiv class=\"ch-head\">\u003cspan style=\"font-size:52px\">🗳️\u003c/span>\u003cdiv>\u003cdiv class=\"eyebrow\">Team Christmas Traditions · gallery\u003c/div>\u003ch2>Голосуємо за найкращу традицію\u003c/h2>\u003c/div>\u003cdiv class=\"qcount\">\u003c/div>' + timerRing() + '\u003c/div>'\n  + '\u003cp class=\"hint\" style=\"margin-bottom:18px\">Кожен учасник має один голос. За свій екіпаж голосувати не можна. Голос можна змінити до кінця таймера.\u003c/p>'\n  + '\u003cdiv class=\"gallery\" data-soft=\"gallery\">' + SOFT.gallery() + '\u003c/div>\u003c/section>');\nfunction vote(tid) { VOTES[ME.playerId] = tid; softPatch(); call('castVote', ME.playerId, ME.teamId, tid).then(() => poll(true)); }\n\n/* ---------- Нагородження ---------- */\nfunction achievements() {\n  const pick = (title, icon, desc, fn) => {\n    const sc = S.teams.map(t => ({ t, v: fn(t.id) })).sort((a, b) => b.v - a.v);\n    return { title, icon, desc, w: sc[0] && sc[0].v > 0 ? sc[0].t : null };\n  };\n  const over = (id, f, filter) => Object.keys(SC).filter(k => k !== 'wheel' && (!filter || filter(+k))).reduce((s, k) => s + (+(SC[k][id] || {})[f] || 0), 0);\n  const isAuto = k => k \u003c NC && CFG.countries[k].rounds.some(r => ['choice', 'truefalse', 'match'].indexOf(r.type) >= 0);\n  const isCre = k => k === NC || (k \u003c NC && CFG.countries[k].rounds.some(r => ['text', 'budget'].indexOf(r.type) >= 0));\n  return [\n    pick('Fastest Crew', '⚡', 'Найшвидші відповіді експедиції', id => over(id, 'speed', k => k \u003c NC)),\n    pick('Culture Experts', '🎓', 'Найбільше правильних відповідей', id => over(id, 'correct', isAuto)),\n    pick('Creative Explorers', '🎨', 'Найкреативніші ідеї й традиція', id => over(id, 'correct', isCre) + over(id, 'speed', k => k === NC)),\n    pick('Best Team Spirit', '🤝', 'Взаємодія і секретні місії', id => over(id, 'team') + over(id, 'bonus'))\n  ];\n}\nfunction passportHtml(t) {\n  const pp = S.passport[t.id] || { stamps: [], souvenirs: [] }, f = FIN[t.id];\n  return '\u003cdiv class=\"passport\" id=\"pp-' + t.id + '\">\u003cdiv class=\"pp-cover\">\u003cdiv class=\"tz\">' + TRIDENT_SVG + '\u003c/div>\u003cdiv class=\"t\">УКРАЇНА · ПАСПОРТ\u003cbr>UKRAINE · PASSPORT\u003c/div>\u003cdiv class=\"chip\">' + CHIP_SVG + '\u003c/div>\u003c/div>'\n    + '\u003cdiv class=\"pp-page\">\u003cdiv class=\"pass-k\">Traveler crew\u003c/div>\u003ch3>' + esc(t.name) + '\u003c/h3>\u003cdiv class=\"mem\">' + t.members.map(m => esc(m.name)).join(' · ') + '\u003c/div>'\n    + '\u003cdiv class=\"pp-stamps\">' + CFG.countries.map((c, i) => pp.stamps.indexOf(i) >= 0 ? stampHtml(i) : '\u003cdiv class=\"stamp empty ' + STAMP_SHAPES[i] + '\" style=\"--rot:0deg\">\u003cb>' + esc(c.name) + '\u003c/b>\u003c/div>').join('') + '\u003c/div>'\n    + '\u003cdiv class=\"pp-foot\">\u003cdiv>\u003cdiv class=\"pass-k\">Сувеніри\u003c/div>\u003cdiv class=\"souv\">' + (pp.souvenirs.map(i => emojiOf(CFG.countries[i].souvenir)).join(' ') || '—') + '\u003c/div>'\n    + (f && f.name ? '\u003cdiv class=\"pass-k\" style=\"margin-top:6px\">Наша традиція\u003c/div>\u003cb>' + esc(emojiOf(f.symbol || '')) + ' ' + esc(f.name) + '\u003c/b>' : '') + '\u003c/div>'\n    + '\u003cdiv style=\"text-align:right\">\u003cdiv class=\"pass-k\">Travel Points\u003c/div>\u003cdiv class=\"tp\">' + teamTotal(t.id) + '\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>';\n}\nfunction cardsWall() {\n  if (!CARDS.length) return '\u003cp class=\"hint\">Листівок поки немає. Надішліть першу через кнопку 💌 у телефоні!\u003c/p>';\n  return '\u003cdiv class=\"cards-wall\">' + CARDS.slice().reverse().map((c, i) => '\u003cdiv class=\"pcard\" style=\"--r:' + ((i % 5) - 2) * 1.2 + 'deg\">\u003cdiv class=\"k\">' + esc(c.kind) + ' · для: ' + esc(c.to) + '\u003c/div>\u003cdiv class=\"t\">' + esc(c.text) + '\u003c/div>\u003cdiv class=\"f\">— ' + esc(c.from) + '\u003c/div>\u003c/div>').join('') + '\u003c/div>';\n}\nV.awards = () => {\n  const R = ranking(), med = ['🥇', '🥈', '🥉'];\n  const order = [1, 0, 2].filter(i => R[i]);\n  const best = (() => { const cnt = {}; Object.keys(VOTES).forEach(k => cnt[VOTES[k]] = (cnt[VOTES[k]] || 0) + 1); let b = null; S.teams.forEach(t => { if ((cnt[t.id] || 0) > 0 && (!b || cnt[t.id] > cnt[b.id])) b = t; }); return b; })();\n  const visible = IS_PLAYER ? S.teams.filter(t => t.id === ME.teamId).concat(S.teams.filter(t => t.id !== ME.teamId)) : S.teams;\n  return '\u003csection class=\"page\">\u003cheader class=\"ph\" style=\"text-align:center\">\u003cdiv class=\"eyebrow\">Awards & Passport · Expedition complete\u003c/div>\u003ch2>Експедицію завершено! 🎉\u003c/h2>\u003cp style=\"margin:0 auto\">Шість країн, шість традицій — і одна нова, створена командою.\u003c/p>\u003c/header>'\n    + '\u003cdiv class=\"podium\">' + order.map(i => '\u003cdiv class=\"pod p' + (i + 1) + '\">\u003cdiv class=\"md\">' + med[i] + '\u003c/div>\u003ch3>' + esc(R[i].t.name) + '\u003c/h3>\u003cdiv class=\"p\">' + R[i].s + '\u003c/div>\u003cdiv class=\"hint\">' + R[i].t.members.length + ' мандрівн.\u003c/div>\u003c/div>').join('') + '\u003c/div>'\n    + '\u003ch2 class=\"sec-h\">Achievement cards\u003c/h2>\u003cdiv class=\"ach\">' + achievements().map((a, i) => '\u003cdiv class=\"achc\" style=\"animation-delay:' + i * .15 + 's\">\u003cdiv class=\"i\">' + a.icon + '\u003c/div>\u003ch3>' + a.title + '\u003c/h3>\u003cdiv class=\"hint\" style=\"color:#6b5d48\">' + a.desc + '\u003c/div>\u003cdiv class=\"w\">' + (a.w ? esc(a.w.name) : '—') + '\u003c/div>\u003c/div>').join('') + '\u003c/div>'\n    + (best ? '\u003ch2 class=\"sec-h\">Традиція-переможниця\u003c/h2>\u003cdiv style=\"max-width:620px\">' + tradCard(best, FIN[best.id]) + '\u003c/div>' : '')\n    + '\u003ch2 class=\"sec-h\">Digital Travel Passports\u003c/h2>\u003cdiv class=\"passports\">' + visible.map(t => '\u003cdiv>' + passportHtml(t)\n      + ((!IS_PLAYER || t.id === ME.teamId) ? '\u003cdiv style=\"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap\">\u003cbutton class=\"btn sm\" onclick=\"saveImg(\\'pp-' + t.id + '\\',\\'passport\\')\">⬇ Паспорт PNG\u003c/button>' + (FIN[t.id] && FIN[t.id].name ? '\u003cbutton class=\"btn sm\" onclick=\"showTradition(\\'' + t.id + '\\')\">⬇ Листівка-традиція\u003c/button>' : '') + '\u003c/div>' : '') + '\u003c/div>').join('') + '\u003c/div>'\n    + '\u003ch2 class=\"sec-h\">Postcards from the Team\u003c/h2>' + cardsWall() + '\u003c/section>';\n};\nAFTER.awards = (isNew) => { if (isNew && wasSeen('hq') && !ppBusy) { sfxFanfare(); confetti(); } };\nfunction showTradition(tid) {\n  $('#imgBox').innerHTML = '\u003cdiv style=\"text-align:left\">' + tradCard(team(tid), FIN[tid]) + '\u003c/div>\u003cbutton class=\"btn gold\" style=\"margin-top:14px\" onclick=\"saveImg(\\'pc-' + tid + '\\',\\'tradition\\')\">⬇ Зберегти листівку\u003c/button>';\n  showOv('ovImg');\n}\n/* Зберігає блок як картинку PNG (якщо браузер не дає завантажити — показує картинку для «Зберегти як…») */\nfunction saveImg(id, name) {\n  const el = document.getElementById(id); if (!el || !window.html2canvas) return toast('Не вдалося підготувати картинку');\n  toast('Готуємо картинку…');\n  html2canvas(el, { scale: 2, backgroundColor: null, useCORS: true }).then(cv => {\n    const url = cv.toDataURL('image/png');\n    try { const a = document.createElement('a'); a.href = url; a.download = name + '-' + YEAR + '.png'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {}\n    $('#imgBox').innerHTML = '\u003cp class=\"hint\">Якщо файл не завантажився — натисніть на картинку правою кнопкою (або довго на телефоні) і оберіть «Зберегти зображення».\u003c/p>\u003cimg src=\"' + url + '\" style=\"width:100%;border-radius:12px\">';\n    showOv('ovImg');\n  });\n}\n\n/* ================= ОВЕРЛЕЇ: колесо, паспорт, листівки ================= */\nfunction showOv(id) { $('#' + id).classList.add('show'); }\nfunction hideOv(id) { $('#' + id).classList.remove('show'); }\nlet wheelSeen = 0;\nfunction renderOverlays() {\n  if (!S) return;\n  // Колесо удачі\n  if (S.wheel && CFG.wheel.length) {\n    const w = S.wheel;\n    if (wheelSeen !== w.at) {\n      wheelSeen = w.at;\n      const n = CFG.wheel.length, seg = 360 / n, t = team(w.team), ev = CFG.wheel[w.idx];\n      const cols = ['#7C444F', '#142536', '#A56F63', '#1c3349', '#B99A66', '#5E8C8A'];\n      let svg = '\u003csvg viewBox=\"-110 -110 220 220\">';\n      CFG.wheel.forEach((e, i) => {\n        const a0 = (i * seg - 90) * Math.PI / 180, a1 = ((i + 1) * seg - 90) * Math.PI / 180;\n        svg += '\u003cpath d=\"M0 0 L' + 100 * Math.cos(a0) + ' ' + 100 * Math.sin(a0) + ' A100 100 0 0 1 ' + 100 * Math.cos(a1) + ' ' + 100 * Math.sin(a1) + 'Z\" fill=\"' + cols[i % cols.length] + '\" stroke=\"#D8BE8C\" stroke-width=\"1\"/>';\n        const am = (i + .5) * seg - 90;\n        svg += '\u003cg transform=\"rotate(' + am + ') translate(62 0) rotate(90)\">\u003ctext text-anchor=\"middle\" font-size=\"20\" y=\"7\">' + esc(emojiOf(e.title)) + '\u003c/text>\u003c/g>';\n      });\n      svg += '\u003ccircle r=\"14\" fill=\"#B99A66\"/>\u003ccircle r=\"104\" fill=\"none\" stroke=\"#B99A66\" stroke-width=\"4\"/>\u003c/svg>';\n      const fresh = Date.now() + OFF - w.at \u003c 5500;\n      const target = 360 * 6 - (w.idx + .5) * seg;\n      $('#wheelBox').innerHTML = '\u003cdiv class=\"wheel-wrap\">\u003cdiv class=\"eyebrow\">Lucky Traveler Wheel · ' + (t ? esc(t.name) : '') + '\u003c/div>\u003cdiv class=\"wheel\">\u003cdiv id=\"wsvg\" style=\"width:100%;height:100%\">' + svg + '\u003c/div>\u003c/div>\u003cdiv class=\"wheel-res\" id=\"wres\">\u003c/div>'\n        + (IS_HOST ? '\u003cbutton class=\"btn\" onclick=\"act(\\'wheelClose\\')\">Закрити колесо\u003c/button>' : '') + '\u003c/div>';\n      const s = $('#wsvg svg');\n      const showRes = () => { $('#wres').innerHTML = '\u003ch2>' + esc(ev.title) + '\u003c/h2>\u003cp>' + esc(ev.text) + '\u003c/p>' + (ev.pts ? '\u003cdiv class=\"pts\">' + (ev.pts > 0 ? '+' : '') + ev.pts + ' Travel Points\u003c/div>' : ''); if (fresh) sfxChime(); };\n      if (fresh) { s.style.transform = 'rotate(0deg)'; requestAnimationFrame(() => requestAnimationFrame(() => { s.style.transform = 'rotate(' + target + 'deg)'; })); setTimeout(showRes, 5100); sfxSpin(); }\n      else { s.style.transition = 'none'; s.style.transform = 'rotate(' + target + 'deg)'; showRes(); }\n      showOv('ovWheel');\n    }\n  } else if (wheelSeen) { wheelSeen = 0; hideOv('ovWheel'); }\n  // Стіна листівок\n  const seq = S.cardsSeq || 0;\n  if (S.showCards && wallClosedSeq !== seq && !$('#ovWall').classList.contains('show')) showOv('ovWall');\n  if (!S.showCards && $('#ovWall').classList.contains('show')) hideOv('ovWall');\n  if (S.showCards) $('#wallBox').innerHTML = '\u003cdiv class=\"eyebrow\">Postcards from the Team\u003c/div>\u003ch2 style=\"font-size:36px;margin:6px 0 18px\">Листівки від команди 💌\u003c/h2>' + cardsWall();\n}\nfunction openPassport() { const t = myTeam(); if (!t) return; $('#passBox').innerHTML = '\u003cdiv class=\"eyebrow\" style=\"margin-bottom:12px\">Digital Travel Passport\u003c/div>' + passportHtml(t) + '\u003cbutton class=\"btn sm\" style=\"margin-top:12px\" onclick=\"saveImg(\\'pp-' + t.id + '\\',\\'passport\\')\">⬇ Зберегти PNG\u003c/button>'; showOv('ovPass'); }\nfunction openComposer() {\n  const people = [].concat.apply([], S.teams.map(t => t.members)).filter(m => m.id !== ME.playerId);\n  $('#cardBox').innerHTML = '\u003cdiv class=\"eyebrow\">Postcards from the Team\u003c/div>\u003ch2 style=\"font-size:30px;margin:6px 0 14px\">Листівка колезі 💌\u003c/h2>\u003cdiv class=\"form\">'\n    + '\u003clabel>Кому\u003c/label>\u003cselect class=\"big\" id=\"pcTo\">\u003coption>Усім\u003c/option>' + people.map(m => '\u003coption>' + esc(m.name) + '\u003c/option>').join('') + '\u003c/select>'\n    + '\u003clabel>Тип листівки\u003c/label>\u003cselect class=\"big\" id=\"pcKind\">\u003coption>🎁 Побажання\u003c/option>\u003coption>🙋 Факт про мене\u003c/option>\u003coption>🔮 Передбачення на ' + YEAR + '\u003c/option>\u003c/select>'\n    + '\u003clabel>Текст\u003c/label>\u003ctextarea class=\"big\" id=\"pcText\" rows=\"4\" maxlength=\"280\" placeholder=\"Кілька теплих слів…\">\u003c/textarea>'\n    + '\u003cbutton class=\"btn gold\" onclick=\"sendCard()\">Надіслати ✉\u003c/button>\u003c/div>';\n  showOv('ovCard');\n}\nlet cardSending = false;\nfunction sendCard() {\n  const text = $('#pcText').value.trim(); if (!text) return toast('Напишіть кілька слів ✍');\n  if (cardSending) return; // захист від подвійного натискання\n  cardSending = true;\n  call('sendPostcard', ME.name, $('#pcTo').value, $('#pcKind').value, text)\n    .then(() => { hideOv('ovCard'); toast('Листівку надіслано! 💌'); })\n    .finally(() => { cardSending = false; });\n}\n\n/* ================= ПУЛЬТ ВЕДУЧОГО ================= */\nfunction toggleDock() { dockOpen = !dockOpen; renderDock(); }\nfunction toggleSound() { soundOn = !soundOn; renderHud(); }\nlet lastDock = '';\nfunction renderDock() {\n  const d = $('#dock');\n  if (IS_PULT) dockOpen = true;\n  if (!IS_HOST || !PIN || !S) { d.classList.remove('show'); return; }\n  d.classList.toggle('show', dockOpen);\n  if (document.body.classList.contains('dock-open') !== dockOpen) {\n    document.body.classList.toggle('dock-open', dockOpen);\n    if (MAP) setTimeout(() => { try { MAP.invalidateSize(); } catch (e) {} }, 50);\n  }\n  if (d.contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName)) return;\n  const B = (label, a, p, cls) => '\u003cbutton class=\"btn ' + (cls || '') + '\" onclick=\\'act(' + JSON.stringify(a) + ',' + JSON.stringify(p || {}) + ')\\'>' + label + '\u003c/button>';\n  const ph = S.phase;\n  const nx = nextStep();\n  let h = '\u003cdiv class=\"drow nextrow\">\u003cspan class=\"lbl\">Зараз\u003c/span>\u003cspan class=\"nexthint\">' + nx.hint + '\u003c/span>'\n    + (nx.action ? '\u003cbutton class=\"btn gold nextbtn\" onclick=\"act(\\'next\\')\">' + nx.label + '\u003c/button>' : '') + '\u003c/div>';\n  h += '\u003cdiv class=\"drow\">\u003cspan class=\"lbl\">Екран\u003c/span>'\n    + [['welcome', 'Вітання'], ['registration', 'Реєстрація'], ['map', 'Карта'], ['leaderboard', 'Рейтинг'], ['awards', 'Нагородження']].map(x => B(x[1], 'goto', { phase: x[0] }, ph === x[0] ? 'on' : '')).join('')\n    + '\u003cspan class=\"lbl\" style=\"margin-left:10px\">Колесо\u003c/span>\u003cselect id=\"wTeam\">' + S.teams.map(t => '\u003coption value=\"' + t.id + '\">' + esc(t.name) + '\u003c/option>').join('') + '\u003c/select>'\n    + '\u003cbutton class=\"btn\" onclick=\"act(\\'wheelSpin\\',{teamId:$(\\'#wTeam\\').value})\">🎡 Крутити\u003c/button>'\n    + B(S.showCards ? '💌 Сховати листівки' : '💌 Стіна листівок', 'toggleCards', {}, S.showCards ? 'on' : '')\n    + '\u003cbutton class=\"btn\" onclick=\"reloadCfg()\">⟳ Дані з таблиці\u003c/button>'\n    + '\u003cbutton class=\"btn\" onclick=\"if(confirm(\\'Почати нову гру? Команди й бали на сайті обнуляться (журнали в таблиці залишаться).\\'))act(\\'reset\\')\">⟲ Нова гра\u003c/button>\u003c/div>';\n  h += '\u003cdiv class=\"drow\">\u003cspan class=\"lbl\">Таймер\u003c/span>' + B('30 с', 'timerStart', { secs: 30 }) + B('1 хв', 'timerStart', { secs: 60 }) + B('3 хв', 'timerStart', { secs: 180 }) + B('+15 с', 'timerAdd', { secs: 15 })\n    + (S.timer.running ? B('⏸ Пауза', 'timerPause') : B('▶ Далі', 'timerResume')) + B('■ Стоп', 'timerStop') + '\u003c/div>';\n  h += '\u003cdiv class=\"drow\">' + dockPhase() + '\u003c/div>';\n  const extra = dockExtra();\n  if (extra) h += '\u003cdiv class=\"drow\" style=\"display:block\">' + extra + '\u003c/div>';\n  if (h !== lastDock) { d.innerHTML = h; lastDock = h; }\n}\n/* Підказка ведучому: що відбувається зараз і яка наступна дія (велика кнопка «Далі») */\nfunction nextStep() {\n  const ph = S.phase, c = CFG.countries[S.stage], nx = nextStage();\n  const players = S.teams.reduce((n, t) => n + t.members.length, 0);\n  switch (ph) {\n    case 'welcome': return { hint: 'Розкажіть легенду експедиції, потім відкрийте реєстрацію.', label: 'Далі: реєстрація екіпажів ▶', action: 'openRegistration' };\n    case 'registration': return { hint: 'Гравці сканують QR-код і вводять свій нік. Уже приєдналося: ' + players + '. Коли всі на місці, тисніть «Далі».', label: 'Далі: карта маршруту ✈', action: 'goto', p: { phase: 'map' } };\n    case 'map': return nx \u003c NC\n      ? { hint: 'Карта маршруту. Наступна зупинка: ' + esc(CFG.countries[nx].name) + '.', label: 'Далі: летимо ✈ ' + esc(CFG.countries[nx].name), action: 'openStage', p: { stage: nx } }\n      : { hint: 'Усі шість країн пройдено. Час фінальної місії.', label: 'Далі: фінальна місія ✈', action: 'openFinal' };\n    case 'destination': return { hint: esc(c.name) + ': розкажіть історію, проведіть знайомство' + (S.secret ? '' : ' (секретну місію можна відкрити кнопкою нижче)') + '.', label: 'Далі: почати завдання ▶', action: 'startChallenge', p: { q: 0 } };\n    case 'challenge': {\n      const last = S.q >= c.rounds.length - 1;\n      if (!S.qReveal) return { hint: 'Питання ' + (S.q + 1) + ' з ' + c.rounds.length + '. Відповіли: ' + S.answered.length + ' з ' + S.teams.length + ' екіпажів.', label: 'Далі: показати відповідь 💡', action: 'reveal' };\n      return last ? { hint: 'Це було останнє питання країни.', label: 'Далі: підсумувати бали 🏁', action: 'finishChallenge' }\n        : { hint: 'Обговоріть правильну відповідь.', label: 'Далі: наступне питання ▶', action: 'gotoQuestion', p: { q: S.q + 1 } };\n    }\n    case 'results': return S.stage === NC\n      ? { hint: 'Перевірте фінальні бали в таблиці нижче.', label: 'Далі: нагородження 🏆', action: 'awards' }\n      : { hint: 'Поставте «Взаємодію» і «Бонус» у таблиці нижче, якщо треба.', label: 'Далі: видати штампи і рейтинг 🛂', action: 'saveStage' };\n    case 'leaderboard': return nx \u003c NC\n      ? { hint: 'Рейтинг після країни. Можна крутнути колесо удачі.', label: 'Далі: карта маршруту ✈', action: 'goto', p: { phase: 'map' } }\n      : { hint: 'Рейтинг після всіх країн.', label: 'Далі: фінальна місія ✈', action: 'openFinal' };\n    case 'final': return { hint: 'Екіпажі пишуть свою традицію на телефонах. Прогрес видно на екрані.', label: 'Далі: голосування 🗳️', action: 'openVoting' };\n    case 'voting': return { hint: 'Екіпажі презентують традиції, учасники голосують на телефонах.', label: 'Далі: підрахувати бали 🧮', action: 'finalScores' };\n    case 'awards': return { hint: 'Гру завершено. Можна показати стіну листівок.', label: '', action: '' };\n  }\n  return { hint: '', label: '', action: '' };\n}\nfunction reloadCfg() { call('hostAction', PIN, 'reloadConfig', {}).then(c => { const url = CFG.url; CFG = c; CFG.url = url; Object.keys(MUSIC_CACHE).forEach(k => delete MUSIC_CACHE[k]); Object.keys(MUSIC_LOADING).forEach(k => delete MUSIC_LOADING[k]); musicSlot = ''; musicKey = ''; musicErr = false; if (CFG.settings.music && !IS_PLAYER) musicOn = true; syncMusic(); toast('Дані з таблиці оновлено ✓'); render(true); }); }\nfunction dockPhase() {\n  const B = (label, a, p, cls) => '\u003cbutton class=\"btn ' + (cls || '') + '\" onclick=\\'act(' + JSON.stringify(a) + ',' + JSON.stringify(p || {}) + ')\\'>' + label + '\u003c/button>';\n  const ph = S.phase, c = CFG.countries[S.stage];\n  switch (ph) {\n    case 'welcome': return '\u003cspan class=\"lbl\">Старт\u003c/span>' + B('Start Journey → реєстрація', 'openRegistration', {}, 'gold');\n    case 'registration': return '\u003cspan class=\"lbl\">Екіпажі\u003c/span>\u003cselect onchange=\"act(\\'setTeamCount\\',{n:this.value})\">' + [2, 3, 4, 5].map(n => '\u003coption ' + (n === S.teams.length ? 'selected' : '') + '>' + n + '\u003c/option>').join('') + '\u003c/select> екіпажі '\n      + B('🎲 Перемішати випадково', 'shuffleTeams') + B('До карти маршруту ✈', 'goto', { phase: 'map' }, 'gold');\n    case 'map': return '\u003cspan class=\"lbl\">Країни\u003c/span>' + CFG.countries.map((x, i) => B((S.completed.indexOf(i) >= 0 ? '✓ ' : '') + '0' + (i + 1) + ' ' + x.name, 'openStage', { stage: i }, i === nextStage() ? 'gold' : '')).join('') + B('🌍 Фінальна місія', 'openFinal', {}, nextStage() === NC ? 'gold' : '');\n    case 'destination': return '\u003cspan class=\"lbl\">' + esc(c.name) + '\u003c/span>' + B(S.secret ? '🔒 Сховати секретну місію' : '🔓 Відкрити секретну місію', 'toggleSecret') + B('▶ Почати завдання', 'startChallenge', { q: 0 }, 'gold') + B('← Карта', 'goto', { phase: 'map' });\n    case 'challenge': {\n      const r = c.rounds[S.q], last = S.q >= c.rounds.length - 1;\n      return '\u003cspan class=\"lbl\">Питання\u003c/span>' + c.rounds.map((_, i) => B(String(i + 1), 'gotoQuestion', { q: i }, i === S.q ? 'on' : '')).join('')\n        + (S.qOpen ? B('🔒 Закрити прийом', 'closeQuestion') : B('↺ Відкрити знову', 'reopenQuestion', { secs: 30 }))\n        + (S.qReveal ? '' : B('💡 Показати відповідь', 'reveal', {}, 'gold'))\n        + (last ? B('🏁 Завершити країну → бали', 'finishChallenge', {}, 'gold') : B('Наступне ▶', 'nextQuestion', {}, S.qReveal ? 'gold' : ''))\n        + B('← Опис країни', 'goto', { phase: 'destination' })\n        + '\u003cspan class=\"hint\" style=\"margin-left:8px\">Правильно (наведіть): \u003cspan class=\"right-ans\">' + esc(rightText(r)) + '\u003c/span>\u003c/span>';\n    }\n    case 'results': return S.stage === NC\n      ? '\u003cspan class=\"lbl\">Фінал\u003c/span>\u003cspan class=\"hint\">Перевірте бали нижче.\u003c/span>' + B('🏆 Нагородження', 'awards', {}, 'gold')\n      : '\u003cspan class=\"lbl\">' + esc(c.name) + '\u003c/span>\u003cspan class=\"hint\">Відредагуйте бали нижче, потім:\u003c/span>' + B('🛂 Видати штампи → рейтинг', 'saveStage', {}, 'gold');\n    case 'leaderboard': return '\u003cspan class=\"lbl\">Далі\u003c/span>' + B('← Карта маршруту', 'goto', { phase: 'map' }, 'gold') + (nextStage() === NC ? B('🌍 Фінальна місія', 'openFinal', {}, 'gold') : '');\n    case 'final': return '\u003cspan class=\"lbl\">Фінал\u003c/span>' + B('🗳️ Відкрити голосування', 'openVoting', {}, 'gold');\n    case 'voting': return '\u003cspan class=\"lbl\">Голосування\u003c/span>' + B('🧮 Підрахувати фінальні бали', 'finalScores', {}, 'gold');\n    case 'awards': return '\u003cspan class=\"lbl\">Кінець\u003c/span>\u003cspan class=\"hint\">Підсумки записано в таблицю (аркуші «Результати», «Паспорт», «Фінальна місія»).\u003c/span>';\n  }\n  return '';\n}\nfunction rightText(r) {\n  if (!r) return '';\n  if (r.type === 'choice' || r.type === 'truefalse') return r.opts[r.right];\n  if (r.type === 'match') return r.left.map((l, i) => l + ' → ' + r.rightList[i]).join('; ');\n  return 'оцінює ведучий';\n}\nfunction dockExtra() {\n  const ph = S.phase;\n  if (ph === 'registration') {\n    return '\u003ctable>\u003ctr>\u003cth>Екіпаж (клік — перейменувати)\u003c/th>\u003cth>Код\u003c/th>\u003cth>Учасники\u003c/th>\u003c/tr>' + S.teams.map(t => '\u003ctr>\u003ctd>\u003ca href=\"#\" style=\"color:' + t.color + '\" onclick=\"renameTeam(\\'' + t.id + '\\');return false\">' + esc(t.name) + '\u003c/a>\u003c/td>\u003ctd class=\"mono\">' + t.code + '\u003c/td>\u003ctd>'\n      + t.members.map(m => '\u003cspan style=\"white-space:nowrap;margin-right:8px\">' + esc(m.name) + ' \u003cselect onchange=\"act(\\'moveMember\\',{playerId:\\'' + m.id + '\\',teamId:this.value})\" title=\"Перемістити\">' + S.teams.map(x => '\u003coption value=\"' + x.id + '\" ' + (x.id === t.id ? 'selected' : '') + '>' + esc(x.name).slice(0, 12) + '\u003c/option>').join('') + '\u003c/select> \u003ca href=\"#\" onclick=\"act(\\'removeMember\\',{playerId:\\'' + m.id + '\\'});return false\" title=\"Прибрати\">✕\u003c/a>\u003c/span>').join('') + '\u003c/td>\u003c/tr>').join('') + '\u003c/table>';\n  }\n  if (ph === 'challenge') {\n    const r = CFG.countries[S.stage].rounds[S.q];\n    return '\u003ctable>\u003ctr>\u003cth>Екіпаж\u003c/th>\u003cth>Відповідь\u003c/th>\u003cth>Хто\u003c/th>\u003cth>Секунд\u003c/th>\u003c/tr>' + S.teams.map(t => {\n      const x = ANS[t.id] && ANS[t.id][S.q];\n      return '\u003ctr>\u003ctd>' + ; return ok + '/' + r.left.length + ' правильних пар'; }\n  if (r.type === 'text') return String(a.text || '').slice(0, 140);\n  if (r.type === 'budget') return '🪙 ' + bCost(r, a.pick || {}) + ' · ' + (a.note || '').slice(0, 80);\n  return '';\n}\nfunction renameTeam(id) { const t = team(id); const n = prompt('Нова назва екіпажу:', t.name); if (n) act('renameTeam', { teamId: id, name: n }); }\n\n/* ================= ЗВУКИ (синтезовані, без файлів) ================= */\nlet AC = null;\nfunction ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }\nfunction tone(f, d, type, v, when) {\n  if (!soundOn) return; const a = ac(); if (!a) return;\n  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (when || 0);\n  o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(v || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);\n  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d);\n}\nfunction sfxClick() { tone(660, .06, 'triangle', .04); }\nfunction sfxTick() { tone(880, .08, 'square', .03); }\nfunction sfxEnd() { tone(220, .5, 'sawtooth', .06); }\nfunction sfxChime() { [784, 988, 1175].forEach((f, i) => tone(f, .5, 'sine', .07, i * .12)); }\nfunction sfxStamp() { tone(90, .25, 'square', .12); tone(60, .3, 'sine', .15, .02); }\nfunction sfxSpin() { for (let i = 0; i \u003c 24; i++) tone(1200, .03, 'square', .02, Math.pow(i / 24, 2) * 4.8); }\nfunction sfxFanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .35, 'triangle', .08, i * .14)); }\nfunction onPhaseSfx(v) {\n  if (v === 'destination') sfxChime();\n  if (S && S.qReveal && v === 'challenge') sfxChime();\n}\nfunction confetti() {\n  const cv = document.createElement('canvas'); cv.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:80'; document.body.appendChild(cv);\n  const x = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;\n  const cols = ['#B99A66', '#D8BE8C', '#7C444F', '#F4EFE5', '#A56F63'];\n  const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, s: 4 + Math.random() * 6, r: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));\n  const t0 = performance.now();\n  (function f(t) {\n    x.clearRect(0, 0, cv.width, cv.height);\n    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });\n    if (t - t0 \u003c 5000) requestAnimationFrame(f); else cv.remove();\n  })(t0);\n}\n\n/* ================= ФОНОВА МУЗИКА (лише на екрані ведучого) ================= */\n// Три частини з аркуша «Налаштування»: заставка (вітання й реєстрація), гра, фінал. Якщо частини немає, грає сусідня.\n// У клітинці може бути кілька посилань через кому: тоді треки грають по черзі, після останнього знову перший.\n// Браузер дозволяє музику лише після першого кліку на сторінці.\nlet musicOn = !IS_PLAYER && !!CFG.settings.music, musicErr = false, musicSlot = '', musicKey = '';\nconst MUSIC_POS = {}; // який трек плейлиста зараз у кожній частині\nfunction musicList(slot) { return String((CFG.settings.musicLinks || {})[slot] || '').split(/[\\s,;]+/).filter(Boolean); }\nconst MUSIC_CACHE = {}, MUSIC_LOADING = {};\nfunction trackFor() {\n  const L = CFG.settings.musicLinks || {};\n  if (!S) return '';\n  const ph = S.phase;\n  const want = (ph === 'welcome' || ph === 'registration') ? 'intro'\n    : (['final', 'voting', 'awards'].indexOf(ph) >= 0 || (ph === 'results' && S.stage === NC)) ? 'final' : 'game';\n  const order = { intro: ['intro', 'game', 'final'], game: ['game', 'intro', 'final'], final: ['final', 'game', 'intro'] }[want];\n  return order.find(k => L[k]) || '';\n}\nfunction loadTrack(slot, idx) {\n  idx = idx || 0;\n  const key = slot + ':' + idx;\n  if (MUSIC_CACHE[key]) return Promise.resolve(MUSIC_CACHE[key]);\n  if (!MUSIC_LOADING[key]) {\n    // файл приходить частинами: одна велика відповідь сервера не проходить\n    const part = i => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).getMusic(slot, i, idx));\n    MUSIC_LOADING[key] = part(0).then(async first => {\n      if (!first || !first.total) return '';\n      if (first.url) return first.url;\n      let b64 = first.data;\n      for (let i = 1; i \u003c first.total; i++) b64 += (await part(i)).data;\n      const bin = atob(b64), bytes = new Uint8Array(bin.length);\n      for (let i = 0; i \u003c bin.length; i++) bytes[i] = bin.charCodeAt(i);\n      return URL.createObjectURL(new Blob([bytes], { type: first.type || 'audio/mpeg' }));\n    }).then(src => { MUSIC_CACHE[key] = src; return src; })\n      .catch(e => { delete MUSIC_LOADING[key]; throw e; });\n  }\n  return MUSIC_LOADING[key];\n}\nfunction syncMusic() {\n  const a = $('#bgm');\n  a.volume = volToGain(musicVol());\n  if (!musicOn) { a.pause(); return; }\n  const slot = trackFor();\n  if (!slot) { a.pause(); return; }\n  const n = musicList(slot).length;\n  const idx = (MUSIC_POS[slot] || 0) % Math.max(1, n);\n  const key = slot + ':' + idx;\n  if (key !== musicKey) {\n    musicSlot = slot; musicKey = key;\n    a.loop = n \u003c= 1; // один трек крутиться по колу, кілька — по черзі\n    loadTrack(slot, idx).then(src => {\n      if (musicKey !== key || !src) return;\n      a.src = src;\n      if (musicOn) a.play().catch(() => {});\n      if (n > 1) setTimeout(() => loadTrack(slot, (idx + 1) % n).catch(() => {}), 4000); // наступний трек готуємо заздалегідь\n    }).catch(e => {\n      musicSlot = ''; musicKey = '';\n      if (!musicErr) { musicErr = true; toast('Музика не завантажилась: ' + (e && e.message || e));  }\n    });\n    return;\n  }\n  if (a.paused && a.getAttribute('src')) a.play().catch(() => {});\n}\nfunction toggleMusic() { musicOn = !musicOn; syncMus otate(-10deg)', mixBlendMode: 'multiply' });\n      stage.appendChild(stampEl);\n    } else {\n      stampEl = stage.querySelector('[data-slot=\"' + opts.newIdx + '\"]');\n      stampEl.classList.remove('hidden');\n    }\n    stampEl.animate([{ opacity: 0, filter: 'blur(3px)', scale: '1.18' }, { opacity: 1, filter: 'blur(0)', scale: '1' }], { duration: 220, easing: 'ease-out' });\n    book.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-3px,4px)' }, { transform: 'translate(3px,-2px)' }, { transform: 'translate(0,0)' }], { duration: 260 });\n    for (let k = 0; k \u003c 9; k++) { // бризки чорнила\n      const d = document.createElement('div'); d.className = 'inkdot';\n      const ang = Math.random() * 6.28, dist = size * (.45 + Math.random() * .25), sz = 2 + Math.random() * 5;\n      Object.assign(d.style, { width: sz + 'px', height: sz + 'px', background: ink, left: (target.x - sr.left + Math.cos(ang) * dist) + 'px', top: (target.y - sr.top + Math.sin(ang) * dist) + 'px', opacity: .8 });\n      stage.appendChild(d); d.animate([{ opacity: .85, scale: '.3' }, { opacity: .6, scale: '1' }, { opacity: 0 }], { duration: 1600, fill: 'forwards' });\n    }\n    await step(260);\n    wood.animate([{ transform: 'translateY(0) rotate(0deg) scaleY(.94)', opacity: 1 }, { transform: 'translateY(-' + (wh * 1.2) + 'px) rotate(10deg)', opacity: 0 }], { duration: 700, easing: 'cubic-bezier(.3,.6,.3,1)', fill: 'forwards' });\n    $('#ppCap').classList.add('show');\n    if (isHQ) { confetti(); sfxFanfare(); }\n    await step(opts.hold || 6000);\n  }\n  ov.classList.remove('show');\n  stage.innerHTML = '';\n  ppSkip = null; ppBusy = false;\n}\n// Що показати: печатки свого екіпажу (гравець) або паспорт експедиції (екран ведучого)\nfunction myStamps() {\n  if (IS_PLAYER && ME.teamId) return ((S.passport || {})[ME.teamId] || { stamps: [] }).stamps.slice();\n  return S.completed.slice();\n}\nfunction seenKey(k) { return 'catw_seen_' + (S.gameId || '') + '_' + k; }\nfunction wasSeen(k) { try { return localStorage.getItem(seenKey(k)) === '1'; } catch (e) { return false; } }\nfunction setSeen(k) { try { localStorage.setItem(seenKey(k), '1'); } catch (e) {} }\n/* Чи треба зараз показати анімацію штампа за останню країну */\nfunction stampDue() {\n  const last = S && S.completed[S.completed.length - 1];\n  return !ppBusy && last !== undefined && !wasSeen('st' + last);\n}\n/* Один раз заздалегідь «малюємо» паспорт невидимим, щоб потім анімація на телефоні стартувала без затримки */\nfunction ppWarmup() {\n  try {\n    const box = document.createElement('div');\n    box.className = 'ov pp-ov show';\n    box.style.cssText = 'visibility:hidden;pointer-events:none';\n    box.innerHTML = '\u003cdiv style=\"position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;perspective:2400px\">'\n      + passportBook(CFG.countries.map((_, i) => i).slice(0, 6), -1).replace('id=\"ppBook\"', '') + '\u003c/div>';\n    document.body.appendChild(box);\n    box.offsetWidth;\n    requestAnimationFrame(() => requestAnimationFrame(() => box.remove()));\n  } catch (e) {}\n}\nsetTimeout(ppWarmup, 2500);\nfunction maybeStampAnim(v) {\n  if (!S || ppBusy || IS_PULT) return;\n  if (v === 'leaderboard') {\n    const last = S.completed[S.completed.length - 1];\n    if (last === undefined || wasSeen('st' + last)) return;\n    setSeen('st' + last);\n    const c = CFG.countries[last];\n    const winners = S.teams.filter(t => ((S.passport || {})[t.id] || { souvenirs: [] }).souvenirs.indexOf(last) >= 0);\n    const t = myTeam();\n    playPassport({ stamps: myStamps().filter(i => i !== last), newIdx: last,\n      eyebrow: (IS_PLAYER && t ? t.name + ' · ' : '') + 'Passport stamp received',\n      title: c.stamp + ' ✓',\n      sub: 'Штамп отримали всі екіпажі.' + (winners.length ? ' Сувенір \u003cb>' + esc(c.souvenir) + '\u003c/b> забирає ' + winners.map(w => '\u003cb>' + esc(w.name) + '\u003c/b>').join(', ') + '!' : '') });\n  }\n  if (v === 'awards' && !wasSeen('hq')) {\n    setSeen('hq');\n    const t = myTeam();\n    const R = ranking();\n    const stamps = IS_PLAYER && t ? myStamps() : (R[0] ? ((S.passport || {})[R[0].t.id] || { stamps: S.completed }).stamps : S.completed);\n    playPassport({ stamps, newIdx: 'hq', hold: 8000, eyebrow: 'Expedition complete',\n      title: 'Паспорт заповнено!', sub: (IS_PLAYER && t ? 'Екіпаж ' + esc(t.name) + ' пройшов' : 'Команда пройшла') + ' усі ' + NC + ' країн маршруту і створила власну традицію' });\n  }\n}\n\n/* ================= ДРІБНИЦІ ================= */\nlet toastT = null;\nfunction toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }\n/* Запам'ятовуємо введений текст, щоб він не зник під час оновлення екрана */\ndocument.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.draft; if (k) DRAFT[k] = e.target.value; });\ndocument.addEventListener('keydown', e => { if (IS_HOST && e.key === 'h' && e.altKey) toggleDock(); });\n\n/* ================= СТАРТ ================= */\nrender(true);\npoll(true);\ninitVolBox();\ninitChat();\nif (window.L && window.topojson) loadWorld();\n";               // код самої гри (з Index.html)
  const ENGINE_SRC = "let PROPS_OVERRIDE_ = null;\nconst KEYS = {\"state\":\"STATE\",\"scores\":\"SCORES\",\"final\":\"FINAL\",\"votes\":\"VOTES\",\"cards\":\"CARDS\"};\nconst SH = {\"settings\":\"Налаштування\",\"countries\":\"Країни\",\"questions\":\"Питання\",\"wheel\":\"Колесо удачі\",\"teams\":\"Команди\",\"answers\":\"Відповіді\",\"scores\":\"Бали\",\"passport\":\"Паспорт\",\"final\":\"Фінальна місія\",\"cards\":\"Листівки\",\"results\":\"Результати\"};\nconst LEAD_MS = 2500;\nconst TEAM_COLORS = [\"#B99A66\",\"#7C444F\",\"#5E8C8A\",\"#A56F63\",\"#6B7FA8\"];\nfunction freshState_() {\r\n  return {\r\n    v: 1, gameId: Utilities.formatDate(new Date(), 'Europe/Kyiv', 'yyyy-MM-dd HH:mm'),\r\n    phase: 'welcome', stage: -1, q: 0, qOpen: false, qReveal: false, qOpenedAt: 0,\r\n    timer: { end: 0, left: 0, total: 0, running: false },\r\n    teams: [], completed: [], secret: false, wheel: null, items: {}, answered: [],\r\n    passport: {}, finalDone: false, showCards: false\r\n  };\r\n}\nfunction getStateObj_() { return load_(KEYS.state, null) || freshState_(); }\nfunction commit_(st) {\r\n  st.v = (st.v || 0) + 1;\r\n  save_(KEYS.state, st);\r\n  CacheService.getScriptCache().put('VER', String(st.v), 600);\r\n}\nfunction withLock_(fn) {\r\n  const lock = LockService.getScriptLock();\r\n  lock.waitLock(20000);\r\n  try { return fn(); } finally { lock.releaseLock(); }\r\n}\nfunction resetState_() {\r\n  withLock_(() => {\r\n    const oldV = (load_(KEYS.state, null) || {}).v || 0; // номер версії не скидаємо, щоб телефони прийняли новий стан\r\n    const props = PropertiesService.getScriptProperties();\r\n    Object.keys(props.getProperties()).forEach(k => { if (k !== 'STYLE_V') props.deleteProperty(k); });\r\n    const fresh = freshState_();\r\n    fresh.v = oldV;\r\n    commit_(fresh);\r\n  });\r\n}\nfunction ansKey_(stage) { return 'ANS_' + stage; }\nfunction load_(key, def) {\r\n  const v = PROPS_OVERRIDE_ ? PROPS_OVERRIDE_[key] : PropertiesService.getScriptProperties().getProperty(key);\r\n  return v ? JSON.parse(v) : def;\r\n}\nfunction save_(key, obj) { PropertiesService.getScriptProperties().setProperty(key, JSON.stringify(obj)); }\nfunction getState(clientVer, teamId, hostPin, chatVer) {\r\n  const c = CacheService.getScriptCache().getAll(teamId ? ['VER', 'CV_' + teamId] : ['VER']);\r\n  const ver = c.VER, cv = teamId ? (c['CV_' + teamId] || '0') : '';\r\n  if (ver && clientVer && String(clientVer) === ver) {\r\n    if (!teamId || String(chatVer || '0') === cv) return { same: true, now: Date.now() };\r\n    return { same: true, now: Date.now(), chat: load_(chatKey_(teamId), []), cv }; // гра без змін, але є нові повідомлення в чаті\r\n  }\r\n  const st = getStateObj_();\r\n  const isHost = hostPin && checkPin_(hostPin);\r\n  const out = { state: st, now: Date.now(), scores: load_(KEYS.scores, {}) };\r\n  if (st.stage >= 0) {\r\n    const ans = load_(ansKey_(st.stage), {});\r\n    if (isHost) out.answers = ans;\r\n    else if (teamId) out.mine = ans[teamId] || {};\r\n  }\r\n  if (teamId) {\r\n    out.chat = load_(chatKey_(teamId), []); out.cv = cv;\r\n    if (st.phase === 'challenge') out.tv = (load_(qvKey_(st.stage, st.q), {})[teamId]) || {}; // хто з екіпажу як проголосував\r\n  }\r\n  if (['final', 'voting', 'results', 'awards'].indexOf(st.phase) >= 0 || st.finalDone) {\r\n    const fin = load_(KEYS.final, {});\r\n    out.final = (st.phase === 'final' && !isHost) ? (teamId ? { [teamId]: fin[teamId] } : {}) : fin;\r\n    out.votes = load_(KEYS.votes, {});\r\n  }\r\n  if (st.showCards || st.phase === 'awards') out.cards = load_(KEYS.cards, []);\r\n  if (isHost && st.phase === 'challenge' && st.qReveal) out.reveal = true;\r\n  // Під час показу правильної відповіді гравці теж її отримують\r\n  if (st.phase === 'challenge' && st.qReveal) {\r\n    const r = getConfig_().countries[st.stage].rounds[st.q];\r\n    if (r) out.right = r.type === 'match' ? r.rightList : r.right;\r\n    if (r) out.explain = r.explain || '';\r\n  }\r\n  return out;\r\n}\nfunction joinGame(name, code, playerId) {\r\n  name = String(name || '').trim().slice(0, 40);\r\n  if (!name) throw new Error('Вкажіть свій нік');\r\n  return withLock_(() => {\r\n    const st = getStateObj_();\r\n    if (!st.teams.length) throw new Error('Ведучий ще не відкрив реєстрацію. Зачекайте хвилинку 🙂');\r\n    playerId = playerId || ('p' + Utilities.getUuid().slice(0, 8));\r\n    st.teams.forEach(t => { t.members = t.members.filter(m => m.id !== playerId); });\r\n    let team;\r\n    code = String(code || '').trim().toUpperCase();\r\n    if (code) {\r\n      team = st.teams.find(t => t.code === code);\r\n      if (!team) throw new Error('Екіпажу з кодом ' + code + ' не знайдено');\r\n    } else {\r\n      const min = Math.min.apply(null, st.teams.map(t => t.members.length));\r\n      const cand = st.teams.filter(t => t.members.length === min);\r\n      team = cand[Math.floor(Math.random() * cand.length)];\r\n    }\r\n    team.members.push({ id: playerId, name });\r\n    commit_(st);\r\n    return { playerId, teamId: team.id, name };\r\n  });\r\n}\nfunction submitAnswer(playerId, teamId, stage, q, answer) {\r\n  return withLock_(() => {\r\n    const st = getStateObj_();\r\n    if (st.phase !== 'challenge' || st.stage !== stage || st.q !== q || !st.qOpen) throw new Error('Час на це питання вже вийшов');\r\n    if (st.timer.running && Date.now() > st.timer.end + 2500) throw new Error('Час вийшов ⏱');\r\n    const team = st.teams.find(t => t.id === teamId);\r\n    if (!team) throw new Error('Вас немає в жодному екіпажі. Приєднайтеся ще раз');\r\n    const who = (team.members.find(m => m.id === playerId) || {}).name || '';\r\n    const r = getConfig_().countries[stage].rounds[q] || {};\r\n    const isVote = ['choice', 'truefalse', 'match'].indexOf(r.type) >= 0;\r\n    const now = Math.max(0, Date.now() - st.qOpenedAt);\r\n    // голос гравця (окремий запис на питання, щоб не роздувати відповіді)\r\n    const qv = load_(qvKey_(stage, q), {});\r\n    const votes = qv[teamId] = qv[teamId] || {};\r\n    const pv = votes[playerId];\r\n    const vote = { by: who, t: pv && pv.a !== undefined && sameAnswer_(pv.a, answer) ? pv.t : now };\r\n    if (isVote) vote.a = answer;\r\n    votes[playerId] = vote;\r\n    save_(qvKey_(stage, q), qv);\r\n    const ans = load_(ansKey_(stage), {});\r\n    ans[teamId] = ans[teamId] || {};\r\n    const prev = ans[teamId][q];\r\n    ans[teamId][q] = isVote ? teamVerdict_(r.type, votes)\r\n      : { a: answer, t: prev && prev.t && sameAnswer_(prev.a, answer) ? prev.t : now, by: who }; // творче завдання: рахується останнє надіслане\r\n    save_(ansKey_(stage), ans);\r\n    if (st.answered.indexOf(teamId) \u003c 0) st.answered.push(teamId);\r\n    commit_(st);\r\n    return true;\r\n  });\r\n}\nfunction sameAnswer_(a, b) { return JSON.stringify(a) === JSON.stringify(b); }\nfunction qvKey_(stage, q) { return 'QV_' + stage + '_' + q; }\nfunction majority_(arr) {\r\n  const g = {};\r\n  arr.forEach(v => { const k = JSON.stringify(v.a); const x = g[k] || (g[k] = { a: v.a, n: 0, t: Infinity }); x.n++; x.t = Math.min(x.t, v.t); });\r\n  return Object.keys(g).map(k => g[k]).sort((x, y) => y.n - x.n || x.t - y.t)[0];\r\n}\nfunction teamVerdict_(type, votes) {\r\n  const list = Object.keys(votes).map(k => votes[k]).filter(v => v.a !== undefined && v.a !== null);\r\n  if (!list.length) return null;\r\n  if (type === 'match') {\r\n    const rows = {}, a = {};\r\n    list.forEach(v => Object.keys(v.a || {}).forEach(i => { (rows[i] = rows[i] || []).push({ a: v.a[i], t: v.t }); }));\r\n    Object.keys(rows).forEach(i => { a[i] = majority_(rows[i]).a; });\r\n    return { a, t: Math.min.apply(null, list.map(v => v.t)), by: list.map(v => v.by).join(', '), n: list.length };\r\n  }\r\n  const w = majority_(list);\r\n  return { a: w.a, t: w.t, by: list.filter(v => sameAnswer_(v.a, w.a)).map(v => v.by).join(', '), n: list.length };\r\n}\nfunction chatKey_(teamId) { return 'CHAT_' + teamId; }\nfunction sendChat(playerId, teamId, text) {\r\n  text = String(text || '').replace(/\\s+/g, ' ').trim().slice(0, 300);\r\n  if (!text) throw new Error('Порожнє повідомлення');\r\n  return withLock_(() => {\r\n    const st = getStateObj_();\r\n    const team = st.teams.find(t => t.id === teamId);\r\n    const me = team && team.members.find(m => m.id === playerId);\r\n    if (!me) throw new Error('Вас немає в цьому екіпажі');\r\n    const chat = load_(chatKey_(teamId), []);\r\n    const id = Math.max(Date.now(), chat.length ? chat[chat.length - 1].i + 1 : 0);\r\n    chat.push({ i: id, p: playerId, by: me.name, x: text });\r\n    while (chat.length > 1 && Utilities.newBlob(JSON.stringify(chat)).getBytes().length > 8000) chat.shift();\r\n    save_(chatKey_(teamId), chat);\r\n    CacheService.getScriptCache().put('CV_' + teamId, String(id), 21600);\r\n    return { chat, cv: String(id) };\r\n  });\r\n}\nfunction saveFinal(teamId, data) {\r\n  return withLock_(() => {\r\n    const st = getStateObj_();\r\n    if (st.phase !== 'final') throw new Error('Фінальна місія зараз закрита');\r\n    const fin = load_(KEYS.final, {});\r\n    const clean = {};\r\n    ['name', 'desc', 'r1', 'r2', 'r3', 'when', 'symbol', 'why'].forEach(k => clean[k] = String((data || {})[k] || '').slice(0, 400));\r\n    clean.at = Date.now();\r\n    fin[teamId] = clean;\r\n    save_(KEYS.final, fin);\r\n    commit_(st);\r\n    return true;\r\n  });\r\n}\nfunction castVote(playerId, myTeamId, teamId) {\r\n  return withLock_(() => {\r\n    const st = getStateObj_();\r\n    if (st.phase !== 'voting') throw new Error('Голосування зараз закрите');\r\n    if (myTeamId === teamId) throw new Error('За свій екіпаж голосувати не можна 😉');\r\n    const votes = load_(KEYS.votes, {});\r\n    votes[playerId] = teamId;\r\n    save_(KEYS.votes, votes);\r\n    commit_(st);\r\n    return true;\r\n  });\r\n}\nfunction sendPostcard(fromName, toName, kind, text) {\r\n  text = String(text || '').trim().slice(0, 280);\r\n  if (!text) throw new Error('Листівка порожня');\r\n  return withLock_(() => {\r\n    const cards = load_(KEYS.cards, []);\r\n    const card = { from: String(fromName || '').slice(0, 40), to: String(toName || 'Усім').slice(0, 40), kind: String(kind || ''), text, at: Date.now() };\r\n    cards.push(card);\r\n    while (JSON.stringify(cards).length > 8500) cards.shift(); // властивість вміщує до 9 КБ\r\n    save_(KEYS.cards, cards);\r\n    const st = getStateObj_();\r\n    ss_().getSheetByName(SH.cards).appendRow([st.gameId, new Date(), card.from, card.to, card.kind, card.text]);\r\n    if (st.showCards || st.phase === 'awards') commit_(st);\r\n    return true;\r\n  });\r\n}\nfunction hostLogin(pin) {\r\n  if (!checkPin_(pin)) throw new Error('Неправильний PIN');\r\n  return true;\r\n}\nfunction hostAction(pin, action, p) {\r\n  if (!checkPin_(pin)) throw new Error('Неправильний PIN');\r\n  p = p || {};\r\n  if (action === 'reloadConfig') { CacheService.getScriptCache().remove('CFG'); return clientCfg_(getConfig_(), 'host'); }\r\n  if (action === 'reset') { resetState_(); return getState(0, '', pin); }\r\n  if (action === 'writeLogs') { // запис журналів у таблицю: сторінка викликає це окремо, у фоні\r\n    const cfg0 = getConfig_(), st0 = getStateObj_();\r\n    if (p.final) writeFinalLogs_(cfg0, st0);\r\n    else writeStageLogs_(cfg0, st0, +p.stage, (load_(KEYS.scores, {})[p.stage]) || {});\r\n    return true;\r\n  }\r\n  const cfg = getConfig_();\r\n  let did = action, didStage = -1;\r\n  withLock_(() => {\r\n    const st = getStateObj_();\r\n    // «Далі» і «Наступне» рахуємо від справжнього стану на сервері: застаріла кнопка не поверне гру назад\r\n    if (action === 'nextQuestion') { action = 'gotoQuestion'; p = { q: st.q + 1 }; }\r\n    if (action === 'next') { const n = nextFor_(st, cfg); action = n ? n.a : 'noop'; p = (n && n.p) || {}; }\r\n    did = action; didStage = st.stage;\r\n    const now = Date.now();\r\n    const startTimer = secs => { st.timer = { end: now + secs * 1000, left: secs * 1000, total: secs * 1000, running: true }; };\r\n    const stopTimer = () => { st.timer = { end: 0, left: 0, total: 0, running: false }; };\r\n    const country = () => cfg.countries[st.stage];\r\n\r\n    switch (action) {\r\n      case 'noop': break;\r\n\r\n      case 'goto': // простий перехід між екранами\r\n        st.showCards = false;\r\n        st.phase = p.phase;\r\n        if (p.phase !== 'challenge') st.qOpen = false;\r\n        break;\r\n\r\n      case 'openRegistration':\r\n        if (!st.teams.length) createTeams_(st, cfg, cfg.settings.teamCount);\r\n        st.phase = 'registration';\r\n        break;\r\n\r\n      case 'setTeamCount': {\r\n        const n = Math.max(2, Math.min(5, +p.n || 3));\r\n        const members = [].concat.apply([], st.teams.map(t => t.members));\r\n        createTeams_(st, cfg, n);\r\n        members.forEach((m, i) => st.teams[i % n].members.push(m));\r\n        break;\r\n      }\r\n\r\n      case 'renameTeam': {\r\n        const t = st.teams.find(x => x.id === p.teamId);\r\n        if (t) t.name = String(p.name || t.name).slice(0, 30);\r\n        break;\r\n      }\r\n\r\n      case 'shuffleTeams': { // випадково перерозподілити всіх учасників\r\n        const all = shuffle_([].concat.apply([], st.teams.map(t => t.members)));\r\n        st.teams.forEach(t => t.members = []);\r\n        all.forEach((m, i) => st.teams[i % st.teams.length].members.push(m));\r\n        break;\r\n      }\r\n\r\n      case 'removeMember':\r\n        st.teams.forEach(t => t.members = t.members.filter(m => m.id !== p.playerId));\r\n        break;\r\n\r\n      case 'moveMember': {\r\n        let mem = null;\r\n        st.teams.forEach(t => { const m = t.members.find(x => x.id === p.playerId); if (m) { mem = m; t.members = t.members.filter(x => x.id !== p.playerId); } });\r\n        const to = st.teams.find(t => t.id === p.teamId);\r\n        if (mem && to) to.members.push(mem);\r\n        break;\r\n      }\r\n\r\n      case 'openStage': { // відкрити країну\r\n        st.showCards = false;\r\n        st.stage = +p.stage; st.q = 0; st.qOpen = false; st.qReveal = false; st.secret = false; st.answered = [];\r\n        st.phase = 'destination';\r\n        const c = country();\r\n        if (c.items.length && !st.items[st.stage]) { // випадкові предмети (Мексика)\r\n          st.items[st.stage] = {};\r\n          st.teams.forEach(t => st.items[st.stage][t.id] = shuffle_(c.items).slice(0, 5));\r\n        }\r\n        stopTimer();\r\n        break;\r\n      }\r\n\r\n      case 'toggleSecret': st.secret = !st.secret; break;\r\n\r\n      case 'startChallenge':\r\n        st.phase = 'challenge'; st.q = +(p.q || 0);\r\n        openQuestion_(st, country(), now, startTimer);\r\n        break;\r\n\r\n      case 'gotoQuestion':\r\n        st.q = Math.max(0, Math.min(country().rounds.length - 1, +p.q));\r\n        openQuestion_(st, country(), now, startTimer);\r\n        break;\r\n\r\n      case 'closeQuestion': st.qOpen = false; st.timer.running = false; st.timer.left = 0; break;\r\n      case 'reopenQuestion': st.qOpen = true; st.qReveal = false; startTimer(+(p.secs || 20)); break;\r\n      case 'reveal': st.qOpen = false; st.qReveal = true; stopTimer(); break;\r\n\r\n      case 'timerStart': startTimer(+p.secs || 60); break;\r\n      case 'timerPause':\r\n        if (st.timer.running) { st.timer.left = Math.max(0, st.timer.end - now); st.timer.running = false; }\r\n        break;\r\n      case 'timerResume':\r\n        if (!st.timer.running && st.timer.left > 0) { st.timer.end = now + st.timer.left; st.timer.running = true; }\r\n        break;\r\n      case 'timerAdd': {\r\n        const add = (+p.secs || 30) * 1000;\r\n        if (st.timer.running && st.timer.end \u003c now) { st.timer.end = now + add; st.timer.total = add; } // час уже вийшов — даємо нові секунди від зараз\r\n        else if (st.timer.running) { st.timer.end += add; st.timer.total += add; }\r\n        else { st.timer.left += add; st.timer.total += add; }\r\n        break;\r\n      }\r\n      case 'timerStop': stopTimer(); break;\r\n\r\n      case 'finishChallenge': { // підрахунок автоматичних балів і перехід до результатів країни\r\n        st.qOpen = false; st.qReveal = false; stopTimer();\r\n        const scores = load_(KEYS.scores, {});\r\n        scores[st.stage] = autoScore_(cfg, st, st.stage, scores[st.stage] || {});\r\n        save_(KEYS.scores, scores);\r\n        st.phase = 'results';\r\n        break;\r\n      }\r\n\r\n      case 'setScore': { // ручне виправлення балів\r\n        const scores = load_(KEYS.scores, {});\r\n        const key = String(p.stage);\r\n        scores[key] = scores[key] || {};\r\n        scores[key][p.teamId] = scores[key][p.teamId] || { correct: 0, speed: 0, team: 0, bonus: 0 };\r\n        scores[key][p.teamId][p.field] = Math.max(-100, Math.min(200, +p.value || 0));\r\n        save_(KEYS.scores, scores);\r\n        break;\r\n      }\r\n\r\n      case 'setAllScore': { // наприклад, «усім +20 за командну взаємодію»\r\n        const scores = load_(KEYS.scores, {});\r\n        const key = String(p.stage);\r\n        scores[key] = scores[key] || {};\r\n        st.teams.forEach(t => {\r\n          scores[key][t.id] = scores[key][t.id] || { correct: 0, speed: 0, team: 0, bonus: 0 };\r\n          scores[key][t.id][p.field] = +p.value || 0;\r\n        });\r\n        save_(KEYS.scores, scores);\r\n        break;\r\n      }\r\n\r\n      case 'saveStage': {\r\n        st.showCards = false; // видати штампи й сувеніри, записати в таблицю, показати рейтинг\r\n        const scores = load_(KEYS.scores, {});\r\n        const sc = scores[st.stage] || {};\r\n        if (st.stage \u003c cfg.countries.length) {\r\n          if (st.completed.indexOf(st.stage) \u003c 0) st.completed.push(st.stage);\r\n          const totals = st.teams.map(t => ({ id: t.id, s: sumScore_(sc[t.id]) }));\r\n          const best = Math.max.apply(null, totals.map(x => x.s));\r\n          st.teams.forEach(t => {\r\n            const pp = st.passport[t.id] = st.passport[t.id] || { stamps: [], souvenirs: [] };\r\n            if (pp.stamps.indexOf(st.stage) \u003c 0) pp.stamps.push(st.stage);\r\n            pp.souvenirs = pp.souvenirs.filter(x => x !== st.stage);\r\n            if (best > 0 && sumScore_(sc[t.id]) === best) pp.souvenirs.push(st.stage);\r\n          });\r\n        }\r\n        st.phase = 'leaderboard';\r\n        break;\r\n      }\r\n\r\n      case 'wheelSpin': { // колесо удачі: випадкова подія для обраного екіпажу\r\n        const idx = Math.floor(Math.random() * cfg.wheel.length);\r\n        const ev = cfg.wheel[idx];\r\n        st.wheel = { team: p.teamId, idx, at: now, done: false };\r\n        const scores = load_(KEYS.scores, {});\r\n        scores.wheel = scores.wheel || {};\r\n        scores.wheel[p.teamId] = (scores.wheel[p.teamId] || 0) + (ev.pts || 0);\r\n        save_(KEYS.scores, scores);\r\n        break;\r\n      }\r\n      case 'wheelClose': st.wheel = null; break;\r\n\r\n      case 'openFinal':\r\n        st.showCards = false;\r\n        st.stage = cfg.countries.length; st.phase = 'final'; st.qOpen = false; st.answered = [];\r\n        startTimer(cfg.settings.finalMinutes * 60);\r\n        break;\r\n\r\n      case 'openVoting': st.phase = 'voting'; stopTimer(); startTimer(180); break;\r\n\r\n      case 'finalScores': { // бали за фінальну місію: ідея + голоси\r\n        const fin = load_(KEYS.final, {});\r\n        const votes = load_(KEYS.votes, {});\r\n        const cnt = {};\r\n        Object.keys(votes).forEach(k => cnt[votes[k]] = (cnt[votes[k]] || 0) + 1);\r\n        const max = Math.max.apply(null, [1].concat(Object.keys(cnt).map(k => cnt[k])));\r\n        const scores = load_(KEYS.scores, {});\r\n        const key = String(cfg.countries.length);\r\n        scores[key] = scores[key] || {};\r\n        st.teams.forEach(t => {\r\n          const f = fin[t.id] || {};\r\n          const filled = ['name', 'desc', 'r1', 'r2', 'r3', 'when', 'symbol', 'why'].filter(k => String(f[k] || '').trim()).length;\r\n          const prev = scores[key][t.id] || {};\r\n          scores[key][t.id] = {\r\n            correct: Math.round(cfg.settings.pts.idea * filled / 8),\r\n            speed: Math.round(cfg.settings.pts.votes * (cnt[t.id] || 0) / max),\r\n            team: prev.team || 0, bonus: prev.bonus || 0, votes: cnt[t.id] || 0\r\n          };\r\n        });\r\n        save_(KEYS.scores, scores);\r\n        st.phase = 'results'; stopTimer();\r\n        break;\r\n      }\r\n\r\n      case 'awards':\r\n        st.showCards = false; // нагородження + запис підсумків у таблицю\r\n        st.finalDone = true; st.phase = 'awards'; stopTimer();\r\n        break;\r\n\r\n      case 'toggleCards':\r\n        st.showCards = !st.showCards;\r\n        if (st.showCards) st.cardsSeq = (st.cardsSeq || 0) + 1; // номер показу: кожен показ стіни відкривається один раз\r\n        break;\r\n\r\n      default: throw new Error('Невідома дія: ' + action);\r\n    }\r\n    commit_(st);\r\n    return true;\r\n  });\r\n  const out = getState(0, '', pin); // новий стан одразу у відповідь: сторінці не треба питати ще раз\r\n  out.did = did; out.didStage = didStage; // яку дію насправді виконано (для фонового запису в таблицю)\r\n  return out;\r\n}\nfunction nextFor_(st, cfg) {\r\n  const NC = cfg.countries.length;\r\n  let nx = NC;\r\n  for (let i = 0; i \u003c NC; i++) if (st.completed.indexOf(i) \u003c 0) { nx = i; break; }\r\n  switch (st.phase) {\r\n    case 'welcome': return { a: 'openRegistration' };\r\n    case 'registration': return { a: 'goto', p: { phase: 'map' } };\r\n    case 'map': return nx \u003c NC ? { a: 'openStage', p: { stage: nx } } : { a: 'openFinal' };\r\n    case 'destination': return { a: 'startChallenge', p: { q: 0 } };\r\n    case 'challenge': {\r\n      if (!st.qReveal) return { a: 'reveal' };\r\n      const last = st.q >= cfg.countries[st.stage].rounds.length - 1;\r\n      return last ? { a: 'finishChallenge' } : { a: 'gotoQuestion', p: { q: st.q + 1 } };\r\n    }\r\n    case 'results': return st.stage === NC ? { a: 'awards' } : { a: 'saveStage' };\r\n    case 'leaderboard': return nx \u003c NC ? { a: 'goto', p: { phase: 'map' } } : { a: 'openFinal' };\r\n    case 'final': return { a: 'openVoting' };\r\n    case 'voting': return { a: 'finalScores' };\r\n  }\r\n  return null;\r\n}\nfunction openQuestion_(st, country, now, startTimer) {\r\n  const r = country.rounds[st.q];\r\n  st.qOpen = true; st.qReveal = false; st.qOpenedAt = now + LEAD_MS; st.answered = [];\r\n  const ans = load_(ansKey_(st.stage), {});\r\n  Object.keys(ans).forEach(tid => { if (ans[tid][st.q]) st.answered.push(tid); });\r\n  startTimer((r ? r.secs : 60) + LEAD_MS / 1000); // таймер включає кілька секунд, поки питання доходить до телефонів\r\n}\nfunction createTeams_(st, cfg, n) {\r\n  const names = cfg.settings.teamNames;\r\n  const used = {};\r\n  st.teams = [];\r\n  for (let i = 0; i \u003c n; i++) {\r\n    let code;\r\n    do { code = randCode_(); } while (used[code]);\r\n    used[code] = 1;\r\n    st.teams.push({ id: 't' + (i + 1), name: names[i] || ('Crew ' + (i + 1)), code, color: TEAM_COLORS[i % TEAM_COLORS.length], members: [] });\r\n  }\r\n}\nfunction randCode_() {\r\n  const abc = 'ABCDEFGHJKLMNPRSTUVWXYZ';\r\n  let s = '';\r\n  for (let i = 0; i \u003c 4; i++) s += abc[Math.floor(Math.random() * abc.length)];\r\n  return s;\r\n}\nfunction shuffle_(a) {\r\n  a = a.slice();\r\n  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }\r\n  return a;\r\n}\nfunction sumScore_(s) { return s ? (+s.correct || 0) + (+s.speed || 0) + (+s.team || 0) + (+s.bonus || 0) : 0; }\nfunction answerFraction_(round, a) {\r\n  if (a === undefined || a === null) return 0;\r\n  if (round.type === 'choice' || round.type === 'truefalse') return +a === round.right ? 1 : 0;\r\n  if (round.type === 'match') {\r\n    if (!a || typeof a !== 'object') return 0;\r\n    let ok = 0;\r\n    round.left.forEach((_, i) => { if (a[i] === round.rightList[i]) ok++; });\r\n    return ok / round.left.length;\r\n  }\r\n  return 0;\r\n}\nfunction autoScore_(cfg, st, stage, prev) {\r\n  const c = cfg.countries[stage];\r\n  const P = cfg.settings.pts;\r\n  const ans = load_(ansKey_(stage), {});\r\n  const auto = c.rounds.filter(r => ['choice', 'truefalse', 'match'].indexOf(r.type) >= 0);\r\n  const out = {};\r\n  st.teams.forEach(t => {\r\n    const a = ans[t.id] || {};\r\n    let corr = 0, spd = 0, n = 0;\r\n    c.rounds.forEach((r, qi) => {\r\n      const x = a[qi];\r\n      if (['choice', 'truefalse', 'match'].indexOf(r.type) >= 0) {\r\n        const f = x ? answerFraction_(r, x.a) : 0;\r\n        corr += f;\r\n        spd += x ? f * Math.max(0, 1 - x.t / (r.secs * 1000)) : 0;\r\n      } else if (x) { // творче завдання здане: стартові 70% від балів за відповіді\r\n        let f = 0.7;\r\n        if (r.type === 'budget') f = budgetCost_(r, x.a) \u003c= r.budget ? 0.7 : 0.3;\r\n        corr += f; spd += 1;\r\n      }\r\n      n++;\r\n    });\r\n    const old = prev[t.id] || {};\r\n    out[t.id] = {\r\n      correct: n ? Math.round(P.correct * corr / n) : 0,\r\n      // за швидкість: у вікторинах трохи підсилюємо (відповідь на половині часу ≈ 70%), у творчих — повні бали за здане вчасно\r\n      speed: n ? Math.round(P.speed * Math.min(1, auto.length ? spd / n * 1.4 : spd / n)) : 0,\r\n      team: old.team || 0, bonus: old.bonus || 0\r\n    };\r\n  });\r\n  return out;\r\n}\nfunction budgetCost_(round, a) {\r\n  if (!a || !a.pick) return 0;\r\n  let sum = 0;\r\n  round.cats.forEach((cat, i) => { const o = cat.opts[a.pick[i]]; if (o) sum += o.cost; });\r\n  return sum;\r\n}\nfunction clientCfg_(cfg, mode) {\r\n  const c = JSON.parse(JSON.stringify(cfg));\r\n  delete c.settings.pin;\r\n  if (mode !== 'player') return c;\r\n  c.countries.forEach(k => k.rounds.forEach(r => {\r\n    delete r.right; delete r.explain;\r\n    if (r.type === 'match') { r.rightList = seededShuffle_(r.rightList, r.q); r.shuffled = true; }\r\n  }));\r\n  return c;\r\n}\nfunction seededShuffle_(arr, seedStr) {\r\n  const a = arr.slice();\r\n  let s = 0;\r\n  for (let i = 0; i \u003c seedStr.length; i++) s = (Math.imul(s, 31) + seedStr.charCodeAt(i)) >>> 0;\r\n  for (let i = a.length - 1; i > 0; i--) {\r\n    s = (Math.imul(s, 1103515245) + 12345) >>> 0;\r\n    const j = s % (i + 1);\r\n    [a[i], a[j]] = [a[j], a[i]];\r\n  }\r\n  return a;\r\n}\n";       // рушій гри (функції з Code.js)
  const q = new URLSearchParams(location.search);

  /* ---------- Підписка на «вітрину» стану: Firebase сам надсилає кожну зміну ---------- */
  const VIEW = { path: '', ref: null, data: null, ready: null };
  function watch(path) {
    if (VIEW.path === path) return VIEW.ready;

    let resolve;
    VIEW.ready = new Promise(r => resolve = r);
    const ref = VIEW.ref = db.ref(path);
    ref.on('value', s => {
      if (VIEW.ref !== ref) return;
      const v = s.val();
      try { VIEW.data = v ? JSON.parse(v) : EMPTY(); } catch (e) { VIEW.data = EMPTY(); }
      resolve();
      if (gameReady()) poll(true); // показуємо зміну одразу

  /* Те саме, що getState на сервері, але з уже отриманої вітрини */

    const d = VIEW.data || EMPTY();

  /* ---------- Дія гравця: запит у чергу, рушій на пульті відповідає ---------- */
  function viaQueue(fn, args) {

      const rr = db.ref('r/' + ref.key);
      let done = false;
      const finish = () => { done = true; clearTimeout(t); rr.off(); };
      const t = setTimeout(() => {
        if (done) return; finish(); ref.remove().catch(() => {});
        rej(new Error('Ведучий зараз не на зв\'язку. Спробуйте ще раз за хвилинку'));
      }, 20000);
      rr.on('value', s => {
        const v = s.val(); if (!v || done) return;

        let o = {}; try { o = JSON.parse(v); } catch (e) {}

        if (done) return; finish(); rej(new Error('Немає зв\'язку: ' + (e && e.message || e)));

  /* ---------- Вхід ведучого: PIN перевіряють правила Firebase ---------- */

  /* ---------- Рушій гри (лише у вкладці пульта) ---------- */
  async function startEngine(pin) {

  /* Пульт на телефоні бере керування на себе (якщо ноут не на зв'язку) */

  /* Екран на ноуті: кнопка 🔑 — ввести PIN і зробити цей екран головним комп'ютером гри */

  /* Пульт відкрили в іншій вкладці — ця вкладка далі працює через чергу */

  function makeEngine(pin, props0) {

  /* ---------- Той самий google.script.run, що в Apps Script ---------- */
  function dispatch(fn, args) {

  /* ---------- Запуск ---------- */

  async function cfgFromFirebase(path) {

        let pin = ''; try { pin = sessionStorage.getItem('catw_pin') || ''; } catch (e) {}
        window.__CFG = c;
        if (pin) await hostLogin(pin, MODE === 'host').catch(() => { try { sessionStorage.removeItem('catw_pin'); } catch (e) {} });
        if (engine) c = engine.cfg;
      }
      if (db && MODE === 'screen') {
        let pin = ''; try { pin = sessionStorage.getItem('catw_screen_pin') || ''; } catch (e) {}
        window.__CFG = c;
        if (pin) await hostLogin(pin, true).catch(() => { try { sessionStorage.removeItem('catw_screen_pin'); } catch (e) {} });
      }
      runGame(c);
      if (db && MODE === 'screen') screenKey();
    } catch (e) {
      console.warn(e);
      setStatus('Не вдалося з\'єднатися з грою. Пробуємо ще раз…');
      setTimeout(() => start(attempt + 1), Math.min(10000, 2000 * (attempt + 1)));
    }
  }
  start(0);
})();

</script>
