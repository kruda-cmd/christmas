<style>

html,body{height:100%;font-family:'Unbounded',system-ui,sans-serif;color:var(--cream);background:var(--deep)}

.codebox span.on{background:var(--sun);color:var(--ink);border-color:var(--cream);animation:pop .6s}
.ppl{font-size:clamp(12px,1.1vw,20px);white-space:nowrap}
.vol{display:flex;align-items:center;gap:6px;font-size:clamp(12px,1.1vw,18px)}

.sub{text-shadow:0 2px 8px rgba(0,0,0,.55);font-size:clamp(13px,1.35vw,24px);opacity:.95;line-height:1.5;margin-top:1.2vh;max-width:70vw}
.legend{font-size:clamp(14px,1.55vw,28px);line-height:1.6;max-width:68vw;margin-top:2.5vh;background:rgba(8,48,59,.55);padding:2.5vh 2.5vw;border-radius:22px}
.cover{max-height:38vh;max-width:60vw;border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.35);margin-bottom:2vh}
.bigemoji{font-size:clamp(60px,9vw,160px);line-height:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.3))}
.reg{display:flex;gap:4vw;align-items:center;justify-content:center;width:100%}

.items{display:grid;grid-template-columns:repeat(5,1fr);gap:1.4vh 1.2vw;margin-top:2.5vh;width:min(92vw,1500px)}

.tk{background:rgba(255,246,229,.95);color:var(--ink);border-radius:22px;padding:2.2vh 1.2vw;text-align:left;display:flex;flex-direction:column;gap:1vh;animation:rise .7s both}
.tk .e{font-size:clamp(36px,4vw,72px)}
.tk .n{font-weight:800;font-size:clamp(13px,1.3vw,22px)}
.tk .x{font-size:clamp(10px,.95vw,16px);line-height:1.45}
.tk .v{font-size:clamp(10px,.95vw,16px);font-weight:600}
.tk .fx{background:var(--sea);color:var(--cream);border-radius:12px;padding:1vh .8vw;font-size:clamp(10px,.95vw,16px);line-height:1.4}

.who{font-size:clamp(30px,4.4vw,80px);font-weight:800;color:var(--sun);margin-top:2.5vh;animation:pop .7s}

.battery:after{content:'';position:absolute;right:-26px;top:30%;width:16px;height:40%;background:var(--cream);border-radius:0 8px 8px 0}
.battery .f{height:100%;border-radius:14px;background:linear-gradient(90deg,var(--coral),var(--sun),var(--ok));transition:width .25s linear}
.battery .p{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(22px,3vw,56px);color:var(--ink);text-shadow:0 0 8px rgba(255,255,255,.8)}
.sos{font-size:clamp(90px,16vw,300px);font-weight:800;color:var(--coral);animation:pulse 1.2s infinite;line-height:1;text-shadow:0 0 40px rgba(242,114,75,.6)}
.names{display:flex;flex-wrap:wrap;gap:1vh 1vw;justify-content:center;max-width:70vw;margin-top:2.5vh}

.solved{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--cream);color:var(--ink);border-radius:30px;padding:4vh 4vw;text-align:center;box-shadow:0 20px 80px rgba(0,0,0,.5);animation:pop .7s}
.solved .d{font-size:clamp(60px,10vw,180px);font-weight:800;color:var(--coral);line-height:1.1}
.hintbar{position:absolute;z-index:4;left:50%;bottom:9vh;transform:translateX(-50%);background:var(--sun);color:var(--ink);padding:1.6vh 2.4vw;border-radius:20px;font-size:clamp(13px,1.4vw,24px);font-weight:600;max-width:80vw;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:rise .5s both}
.fxnote{margin-top:2vh;background:var(--sea);border:2px solid var(--sun);padding:1.2vh 1.6vw;border-radius:16px;font-size:clamp(12px,1.2vw,20px)}
.qrover{position:absolute;z-index:6;inset:0;background:rgba(8,48,59,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2vh}
.hostbar{position:absolute;z-index:7;left:50%;bottom:1.2vh;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(8,48,59,.85);padding:6px;border-radius:16px;opacity:.25;transition:opacity .3s}
.hostbar:hover{opacity:1}
.hb{background:rgba(255,246,229,.15);color:var(--cream);padding:9px 12px;border-radius:11px;font-size:13px;font-weight:600;white-space:nowrap}
.hb.main{background:var(--sun);color:var(--ink)}
.hb.warn{background:var(--coral)}
.tap{position:absolute;z-index:8;right:2vw;top:9vh;background:var(--coral);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;animation:pulse 1.4s infinite}
.toast{position:fixed;z-index:20;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:14px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:92vw;text-align:center}

/* ===== Телефон і пульт ===== */
.ph{min-height:100vh;background:linear-gradient(180deg,#0E4A5A 0%,#08303B 100%);padding:16px 16px 40px}
.phhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9;margin-bottom:14px;gap:8px}

.card{background:var(--cream);color:var(--ink);border-radius:20px;padding:18px;margin-bottom:14px}

.hold{width:72vw;max-width:300px;aspect-ratio:1;border-radius:50%;margin:16px auto 6px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 35% 30%,#ffd28a,var(--coral));color:#fff;font-size:22px;font-weight:800;box-shadow:0 12px 0 #a94a2f,0 20px 40px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.hold.on{transform:translateY(10px);box-shadow:0 2px 0 #a94a2f,0 8px 20px rgba(0,0,0,.35);background:radial-gradient(circle at 35% 30%,#b7f5c9,var(--ok))}
.mbar{height:22px;border-radius:99px;background:#e8dcc0;overflow:hidden;margin-top:10px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--sun),var(--ok));transition:width .25s linear}
.sosbtn{width:72vw;max-width:300px;aspect-ratio:1;border-radius:50%;margin:16px auto;display:flex;align-items:center;justify-content:center;background:var(--coral);color:#fff;font-size:54px;font-weight:800;box-shadow:0 0 0 12px rgba(242,114,75,.3),0 0 0 26px rgba(242,114,75,.15);animation:pulse 1.2s infinite}
.stars{display:flex;justify-content:center;gap:8px;margin-top:10px}
.stars button{font-size:36px;background:none;filter:grayscale(1);opacity:.5}
.stars button.on{filter:none;opacity:1}
.who-opt{display:block;width:100%;text-align:left;background:#fff;border:3px solid #e8dcc0;border-radius:14px;padding:13px 14px;font-size:14px;font-weight:600;margin-top:8px;color:var(--ink)}

.pult .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

.pl{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eadfc6;font-size:13px}
.pl button{background:#f3d6cf;color:#8a2c1b;border-radius:10px;padding:6px 10px;font-size:12px}
.info{font-size:13px;line-height:1.6}
.info b{color:var(--coral)}
.pill{display:inline-block;background:var(--sea);color:var(--cream);border-radius:99px;padding:4px 10px;font-size:12px;margin:3px 3px 0 0}

@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.solved{animation:pops .7s}
@keyframes pops{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}70%{transform:translate(-50%,-50%) scale(1.06)}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.conf{position:fixed;top:-20px;z-index:9;font-size:28px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>

    (nextLabel(st) ? '<button class="btn sun big" data-a="next">' + esc(nextLabel(st)) + '</button>' : '') +
    '<div class="row"><button class="btn ghost" data-a="back">◀ Назад</button>' + (n ? '<button class="btn ghost" data-a="hint">💡 ' + (st.hint ? 'Сховати' : 'Підказка') + '</button>' : '') + '</div></div>' +
    '<div class="card"><h3>Екран і звук</h3><div class="row">' + (st.sun ? '<button class="btn" data-a="sun">' + (st.sun.paused ? '▶ Сонце' : '⏸ Сонце') + '</button><button class="btn" data-a="plus">+5 хв</button>' : '') +
    '<button class="btn" data-a="qr">📱 ' + (st.qr ? 'Сховати QR' : 'Показати QR') + '</button></div>' +
    (FULL.music.length ? '<div class="row"><button class="btn" data-a="music">' + (a.on ? '🔇 Вимкнути музику' : '🎵 Увімкнути музику') + '</button></div>' : '<p class="muted" style="margin-top:10px">Музику можна додати в таблиці: рядок «Музика (посилання)».</p>') + '<div style="display:flex;align-items:center;gap:10px;margin-top:12px">🔊<input type="range" min="0" max="100" id="pvol" value="' + (a.vol != null ? a.vol : FULL.vol) + '" style="flex:1;accent-color:#F2A541"><b id="pvolv">' + (a.vol != null ? a.vol : FULL.vol) + '</b></div>' + '</div>' +
    '<div class="card"><h3>Учасники (' + P.length + ')</h3>' + (P.length ? P.map(p => '<div class="pl"><span>' + esc(p.n) + (FA[p.id] && FA[p.id].t ? ' 📝' : '') + '</span><button data-k="' + esc(p.id) + '">✕ прибрати</button></div>').join('') : '<p class="muted">Поки нікого</p>') + '</div>' +
    '<div class="card"><button class="btn coral" id="rst">' + (Date.now() - resetArm < 3000 ? 'Точно? Натисніть ще раз' : '🔄 Нова гра') + '</button><p class="muted" style="margin-top:8px">Скидає все: учасники заходять знову через QR. Записи в таблиці залишаються.</p></div></div>';
  $('#app').innerHTML = h;
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { if (b.dataset.a === 'next' && lockN(st.phase) && !st.solved[lockN(st.phase)] && !(st.phase === 'l3' && st.l3 && !st.l3.none) && !confirm('Команда ще не відчинила замок. Зарахувати його?')) return; HOST[b.dataset.a](); });
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { if (confirm('Прибрати учасника з гри?')) HOST.kick(b.dataset.k); });
  const r = $('#rst'); r.onclick = () => askReset(r);
  const v = $('#pvol'); if (v) { v.oninput = () => { $('#pvolv').textContent = v.value; }; v.onchange = () => HOST.vol(v.value); }
  onLive();
}
function pultTick() {
  const st = ST, P = players(), left = sunLeft(st);
  const s = document.getElementById('psun'); if (s) s.textContent = st.sun ? (left > 0 ? '☀️ ' + fmtT(left) : '🌙 сонце сіло') : '';
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  if (st.phase === 'pick1' || st.phase === 'pick2') { const k = st.phase === 'pick1' ? 'p1' : 'p2'; set('pv', P.filter(p => AC[p.id] && AC[p.id][k] && AC[p.id][k].t >= st.at - 1500).length); }
  if (st.phase === 'talk') set('ptT', fmtT(st.talkEnd - now()));
  if (st.phase === 'l3' && st.l3 && !st.l3.none) set('pg', P.filter(p => AC[p.id] && AC[p.id].g && +AC[p.id].g.i === st.l3.i).length);
  if (st.phase === 'sos') set('ps', P.filter(p => AC[p.id] && AC[p.id].s && AC[p.id].s >= (st.sosAt || 0) - 2000).length);
}

/* ---------- Телефон учасника ---------- */
const PSENT = {};      // що учасник уже надіслав на цьому кроці
let PICK = [], CELL = '', STARS = 0;
function myClues() { const st = ST || {}, L = st[st.phase]; return L && L.clues ? (L.clues[uid] || []) : []; }
function act(k, v) { return db.ref(ROOT + 'a/' + uid + '/' + k).set(v).catch(e => toast('⚠️ Не надіслалось: ' + (e.message || e))); }
const TS = () => firebase.database.ServerValue.TIMESTAMP;
function renderPlayer() {
  const st = ST, me = PL[uid];
  let h = '<div class="ph"><div class="phhead"><b>🏝️ ' + esc(CFG.title) + '</b><span>' + (me ? '👤 ' + esc(me.n) : '') + '</span></div>';
  if (!me) {
    h += '<div class="card"><h3>Підіймайся на борт!</h3><p>Впиши нікнейм, під яким тебе знає команда.</p><input class="inp" id="nm" maxlength="22" placeholder="Нікнейм" autocomplete="off">' +
      '<p style="margin-top:14px">Один маловідомий факт про себе. Він з’явиться в одному із замків, і команда вгадуватиме, чий він.</p><textarea class="inp" id="fc" maxlength="200" placeholder="Наприклад: у дитинстві я мріяв(-ла) стати капітаном корабля"></textarea>' +
      '<button class="btn sun" id="join">🚢 На борт!</button><p class="muted" style="margin-top:10px">Факт можна не писати.</p></div></div>';
    $('#app').innerHTML = h;
    $('#join').onclick = async () => {
      const n = $('#nm').value.replace(/\s+/g, ' ').trim().slice(0, 22), f = $('#fc').value.trim().slice(0, 200);
      if (!n) { toast('Впиши нікнейм'); return; }
      const taken = players().some(p => p.id !== uid && p.n.toLowerCase() === n.toLowerCase());
      $('#join').disabled = true;
      try {
        await db.ref(ROOT + 'f/' + uid).set(f ? { t: f } : null);
        await db.ref(ROOT + 'pl/' + uid).set({ n: taken ? n + ' ' + (2 + rand(98)) : n, t: TS() });
      } catch (e) { toast('⚠️ ' + (e.message || e)); $('#join').disabled = false; }
    };
    return;
  }
  if (!st) { h += '<div class="card"><h3>Ти на борту! 🎉</h3><p>Ведуча ось-ось відкриє гру. Дивись на екран у Meet.</p></div></div>'; $('#app').innerHTML = h; return; }
  const ph = st.phase, n = lockN(ph);
  const wait = (t, p) => '<div class="card"><h3>' + t + '</h3><p>' + (p || 'Дивись на екран у Meet 👀') + '</p></div>';
  if (n && st.solved[n] && !(n === 3 && st.l3 && !st.l3.none && !st.solved[3])) h += wait('🔓 Замок ' + n + ' відчинено!', 'Цифра коду вже на екрані. Чекаємо наступного замка.');
  else if (ph === 'reg' || ph === 'intro') h += wait('Ти на борту, ' + esc(me.n) + '! 🎉', ph === 'reg' ? 'Чекаємо, поки підніметься вся команда. Дивись на екран у Meet.' : 'Слухай легенду. Скоро знадобиться твоя допомога.');
  else if (ph === 'pick1' || ph === 'pick2') {
    const sent = PSENT[ph];
    h += '<div class="card"><h3>' + (ph === 'pick1' ? 'Що врятуєш з уламків?' : 'Остаточний вибір') + '</h3><p>Обери ' + CFG.take + ' предмети. ' + (ph === 'pick1' ? 'Поки що сам(-а), без підказок.' : 'Тепер з урахуванням суперечки.') + '</p><div class="grid2">' +
      CFG.items.map(x => '<button class="opt ' + (PICK.indexOf(x.n) >= 0 ? 'on' : '') + '" data-i="' + x.n + '"><span class="e">' + esc(x.emoji) + '</span>' + esc(x.name) + '</button>').join('') + '</div>' +
      '<button class="btn sun" id="send" ' + (PICK.length !== CFG.take ? 'disabled' : '') + '>' + (sent ? '✓ Надіслано · надіслати ще раз' : 'Надіслати вибір (' + PICK.length + '/' + CFG.take + ')') + '</button></div>';
  }
  else if (ph === 'talk') h += wait('🗣️ Суперечка на березі', 'Обговорюємо в Meet: хто що обрав і чому? Потім буде остаточне голосування.');
  else if (ph === 'reveal') h += '<div class="card"><h3>Ми беремо з собою</h3>' + (st.taken || []).map(i => { const x = CFG.items[i - 1]; return x ? '<span class="pill">' + esc(x.emoji + ' ' + x.name) + '</span>' : ''; }).join('') + '<p style="margin-top:10px">Дивись на екран: що скаже експерт з виживання?</p></div>';
  else if (ph === 'l1') {
    const mine = myClues();
    h += '<div class="card"><h3>🔐 ' + esc((CFG.locks[0] || {}).name) + '</h3><p>Твої ключі до символів. Назви їх уголос у Meet, а коли команда складе слово, впиши його.</p><div class="keys">' +
      (mine.length ? mine.map(k => '<div class="key"><b>' + esc(k[0]) + '</b>= ' + esc(k[1]) + '</div>').join('') : '<p class="muted">Ключі роздаються…</p>') + '</div>' +
      '<input class="inp" id="w" maxlength="20" placeholder="Слово з символів" autocomplete="off" autocapitalize="characters"><button class="btn sun" id="tryW">Спробувати</button>' + triesP(st.l1) + '</div>';
  }
  else if (ph === 'l2') {
    const mine = myClues();
    h += '<div class="card"><h3>🗺️ ' + esc((CFG.locks[1] || {}).name) + '</h3><p>Твоя зачіпка. Прочитай її команді, потім разом знайдіть клітинку.</p>' + (mine.length ? mine.map(c => '<div class="clue">' + esc(c) + '</div>').join('') : '<p class="muted">Зачіпка в дорозі…</p>') +
      mapHTML('pmap', st, true).replace(/data-cell="([^"]+)"/g, (m, id) => m + (CELL === id ? ' data-sel="1"' : '')) +
      '<button class="btn sun" id="tryC" ' + (CELL ? '' : 'disabled') + '>' + (CELL ? 'Шукати тут: ' + esc(CELL) : 'Торкнися клітинки') + '</button>' + triesP(st.l2) + '</div>';
  }
  else if (ph === 'l3') {
    const L = st.l3;
    if (!L || L.none) h += wait('🪞 Хто з нас?', 'Дивись на екран.');
    else {
      const mineSent = PSENT['l3' + L.i], r = L.rev && L.res[L.i];
      const opts = (L.opts || players().map(p => p.id)).map(id => players().find(p => p.id === id)).filter(Boolean);
      h += '<div class="card"><h3>Чий це факт?</h3><div class="clue">«' + esc(L.facts[L.i].t) + '»</div>';
      if (r) h += '<p style="margin-top:12px;font-size:16px">Це <b>' + esc(r.own) + '</b>! ' + (mineSent ? (mineSent === r.pid ? '🎉 Ти вгадав(-ла)!' : 'Цього разу не вгадав(-ла).') : '') + '</p>';
      else h += (L.opts ? '<p class="muted" style="margin-top:8px">🪞 Дзеркальце залишило 4 варіанти</p>' : '') + opts.map(p => '<button class="who-opt ' + (mineSent === p.id ? 'on' : '') + '" data-p="' + esc(p.id) + '">' + esc(p.n) + (p.id === uid ? ' (це ти)' : '') + '</button>').join('') + (mineSent ? '<p class="muted" style="margin-top:10px">✓ Відповідь надіслано, можна змінити</p>' : '');
      h += '</div>';
    }
  }
  else if (ph === 'l4') h += '<div class="card" style="text-align:center"><h3>📻 ' + esc((CFG.locks[3] || {}).name) + '</h3><p>Затисни кнопку і тримай разом з усіма!</p><div class="hold" id="hold">ТРИМАЙ<span style="font-size:13px;font-weight:400;margin-top:6px">не відпускай</span></div><div class="mbar"><i id="mb" style="width:0%"></i></div><p id="mbt" style="margin-top:8px">Заряд 0%</p></div>';
  else if (ph === 'sos') h += PSENT.sos ? wait('📡 Сигнал надіслано!', 'Чекаємо, поки натиснуть інші…') : '<div class="card" style="text-align:center"><h3>Усі разом!</h3><p>Натисни, щоб надіслати сигнал</p><button class="sosbtn" id="sos">SOS</button></div>';
  else if (ph === 'win') {
    h += '<div class="card" style="text-align:center"><h3>🚁 Нас знайшли!</h3><p>' + esc(CFG.title) + ' пройдено разом. Як тобі гра?</p>';
    if (PSENT.fb) h += '<p style="margin-top:12px;font-size:16px">Дякуємо за відгук! 💛</p>';
    else h += '<div class="stars">' + [1, 2, 3, 4, 5].map(i => '<button data-s="' + i + '" class="' + (i <= STARS ? 'on' : '') + '">⭐</button>').join('') + '</div><textarea class="inp" id="fbc" maxlength="300" placeholder="Що сподобалось найбільше?"></textarea><button class="btn sun" id="fbs" ' + (STARS ? '' : 'disabled') + '>Надіслати</button>';
    h += '</div>';
  }
  h += '</div>';
  holdOff();
  const keepW = $('#w') ? $('#w').value : '', keepF = $('#fbc') ? $('#fbc').value : '';
  $('#app').innerHTML = h;
  if ($('#w')) $('#w').value = keepW; if ($('#fbc')) $('#fbc').value = keepF;
  bindPlayer(st);
}
let HOLDIV = null;   // сигнал «тримаю» йде кожні 0,6 с, доки палець на кнопці
function holdOff() { if (!HOLDIV) return; clearInterval(HOLDIV); HOLDIV = null; act('h', 0); const b = $('#hold'); if (b) b.classList.remove('on'); }
function triesP(L) { return L && L.tries && L.tries.length ? '<p class="muted" style="margin-top:12px">Спроби команди: ' + L.tries.map(t => esc(t.v) + (t.ok ? ' ✓' : ' ✕')).join(' · ') + '</p>' : ''; }
function bindPlayer(st) {
  const ph = st.phase;
  document.querySelectorAll('.opt[data-i]').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, k = PICK.indexOf(i);
    if (k >= 0) PICK.splice(k, 1); else if (PICK.length < CFG.take) PICK.push(i); else { PICK.shift(); PICK.push(i); }
    render(true);
  });
  const s = $('#send'); if (s) s.onclick = () => { act(ph === 'pick1' ? 'p1' : 'p2', { v: PICK.join(','), t: TS() }); PSENT[ph] = 1; toast('✓ Вибір надіслано'); render(true); };
  const tw = $('#tryW'); if (tw) tw.onclick = () => { const v = $('#w').value.trim(); if (!v) return; act('w', { v: v.slice(0, 20), t: TS() }); $('#w').value = ''; toast('Перевіряємо…'); };
  document.querySelectorAll('.pmap .c').forEach(c => c.onclick = () => { CELL = c.dataset.cell; render(true); });
  document.querySelectorAll('.pmap .c[data-sel]').forEach(c => c.classList.add('sel'));
  const tc = $('#tryC'); if (tc) tc.onclick = () => { if (!CELL) return; act('c', { v: CELL, t: TS() }); toast('Копаємо в ' + CELL + '…'); CELL = ''; render(true); };
  document.querySelectorAll('.who-opt').forEach(b => b.onclick = () => { act('g', { i: st.l3.i, v: b.dataset.p, t: TS() }); PSENT['l3' + st.l3.i] = b.dataset.p; render(true); });
  const hold = $('#hold');
  if (hold) {
    const on = e => { e.preventDefault(); if (HOLDIV) return; hold.classList.add('on'); if (navigator.vibrate) navigator.vibrate(30); act('h', TS()); HOLDIV = setInterval(() => act('h', TS()), 600); };
    hold.addEventListener('pointerdown', on); ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => hold.addEventListener(ev, holdOff));
    hold.addEventListener('contextmenu', e => e.preventDefault());
    onLive();
  }
  const sos = $('#sos'); if (sos) sos.onclick = () => { act('s', TS()); PSENT.sos = 1; if (navigator.vibrate) navigator.vibrate([60, 40, 60]); render(true); };
  document.querySelectorAll('.stars button').forEach(b => b.onclick = () => { STARS = +b.dataset.s; const keep = $('#fbc').value; render(true); $('#fbc').value = keep; });
  const fb = $('#fbs'); if (fb) fb.onclick = () => { act('fb', { r: STARS, c: $('#fbc').value.trim().slice(0, 300), t: TS() }); PSENT.fb = 1; render(true); };
}

/* ================= ЗАПУСК ================= */
let lastPhase = '', lastGid = '';
function onData() {
  if (!READY) return;
  if (ST && (ST.phase !== lastPhase || ST.gid !== lastGid)) {
    if (ST.gid !== lastGid) { Object.keys(PSENT).forEach(k => delete PSENT[k]); STARS = 0; }
    lastPhase = ST.phase; lastGid = ST.gid; PICK = []; CELL = '';
    if (ST.phase !== 'l4') CH = null;
    if (ST.phase === 'sos') delete PSENT.sos;
  }
  render();
  if (MODE === 'screen') brain();
}
function showBad() {
  MODE = 'badkey';
  $('#app').innerHTML = '<div class="boot"><div><b>🔒</b>Неправильне посилання ведучої.<br>Перевірте ключ у таблиці, аркуш «Налаштування».</div></div>';
}
async function boot() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(FB);
    const cred = await firebase.auth().signInAnonymously();
    uid = cred.user.uid; db = firebase.database();
    db.ref('.info/serverTimeOffset').on('value', s => { OFF = s.val() || 0; });
    if (MODE !== 'player') {
      try { await db.ref(ROOT + 'hosts/' + uid).set(KEY); } catch (e) { return showBad(); }
      const c = await rpc('config', [KEY]);
      if (!c || !c.full) return showBad();
      FULL = c.full; delete c.full; CFG = c;
      db.ref(ROOT + 'cfg').set(JSON.stringify(CFG)).catch(() => {});
      db.ref(ROOT + 'f').on('value', s => { FA = s.val() || {}; onData(); });
      db.ref(ROOT + 'a').on('value', s => { AC = s.val() || {}; onData(); });
    } else {
      const v = await Promise.race([db.ref(ROOT + 'cfg').once('value'), sleep(6000).then(() => null)]);
      try { CFG = v && v.val() ? JSON.parse(v.val()) : null; } catch (e) { CFG = null; }
      if (!CFG) CFG = await rpc('config', []);
    }
    CFG.url = location.origin + location.pathname;   // QR-код веде на цей сайт
    document.title = CFG.title || document.title;
    db.ref(ROOT + 'state').on('value', s => { try { ST = s.val() ? JSON.parse(s.val()) : null; } catch (e) { ST = null; } onData(); });
    db.ref(ROOT + 'pl').on('value', s => { PL = s.val() || {}; onData(); });
    db.ref(ROOT + 'live').on('value', s => { if (MODE !== 'screen') { LIVE = s.val() || {}; onLive(); } });
    if (MODE !== 'player') { const s = await db.ref(ROOT + 'state').once('value'); if (!s.val()) await mut(() => {}); }
    READY = true; render(true);
    setInterval(tick, 500);
    if (MODE === 'screen') setInterval(brainFast, 250);
  } catch (e) {
    console.warn(e);
    $('#app').innerHTML = '<div class="boot"><div><b>🌊</b>Не вдалося з’єднатися з грою. Пробуємо ще раз…<br><small style="opacity:.6">' + esc(e.message || e) + '</small></div></div>';
    setTimeout(boot, 3000);
  }
}
boot();
</script>
