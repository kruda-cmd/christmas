<!DOCTYPE html>
<html lang="uk">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Christmas Around the World</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ================= ДИЗАЙН-СИСТЕМА: Premium Travel ================= */
:root{
  --navy:#142536; --navy2:#0c1824; --navy3:#1c3349; --ivory:#F4EFE5; --ivory2:#EAE2D2;
  --burg:#7C444F; --gold:#B99A66; --gold2:#D8BE8C; --terra:#A56F63; --teal:#5E8C8A;
  --ink:#1b2735; --muted:rgba(244,239,229,.66); --line:rgba(185,154,102,.28);
  --ok:#7FA37A; --bad:#B4575F;
  --serif:'Playfair Display',Georgia,serif; --sans:'Manrope',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--navy2);color:var(--ivory);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(1200px 700px at 85% -10%,rgba(185,154,102,.16),transparent 60%),
   radial-gradient(900px 600px at -10% 110%,rgba(124,68,79,.25),transparent 60%),
   repeating-linear-gradient(0deg,transparent 0 79px,rgba(185,154,102,.05) 79px 80px),
   repeating-linear-gradient(90deg,transparent 0 79px,rgba(185,154,102,.05) 79px 80px),
   linear-gradient(180deg,var(--navy),var(--navy2));}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:.2px}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2)}
.title{font-family:var(--serif);font-size:clamp(40px,6.4vw,96px);line-height:1;font-weight:800}
.subtitle{font-family:var(--serif);font-style:italic;color:var(--gold2);font-size:clamp(18px,2.2vw,30px)}
.flag{border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.25);display:inline-block;vertical-align:middle;height:auto}
.flag-hq{font-size:1.4em}

/* ---------- Каркас ---------- */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line);background:rgba(12,24,36,.72);backdrop-filter:blur(10px);z-index:20}
.brand{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{color:var(--gold);font-style:normal}
.route-mini{display:flex;align-items:center;gap:6px;margin:0 auto}
.route-mini .rm{position:relative;width:30px;height:22px;border-radius:5px;overflow:hidden;opacity:.35;filter:grayscale(1);transition:.4s}
.route-mini .rm img{width:100%;height:100%;object-fit:cover}
.route-mini .rm.done{opacity:1;filter:none}
.route-mini .rm.cur{opacity:1;filter:none;outline:2px solid var(--gold);outline-offset:2px}
.route-mini .dash{width:14px;height:1px;background:var(--line)}
.route-mini .hqm{font-size:18px;opacity:.5}.route-mini .hqm.cur{opacity:1}
.hud-r{display:flex;align-items:center;gap:10px}
.pill{font-family:var(--mono);font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);white-space:nowrap}
.pill.warn{border-color:var(--bad);color:#ffd9dc;animation:pulse 1s infinite}
.team-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--gold));display:inline-block;flex:none}
.ibtn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ivory);border-radius:12px;padding:7px 11px;font-size:15px}
.ibtn:hover{border-color:var(--gold)}
#main{flex:1;overflow:auto;position:relative}
.page{max-width:1280px;margin:0 auto;padding:34px 28px 60px}
.ph{margin-bottom:26px}.ph h2{font-size:clamp(30px,3.6vw,52px);margin:6px 0 8px}.ph p{color:var(--muted);max-width:760px;margin:0}

/* ---------- Кнопки ---------- */
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;letter-spacing:.2px;background:rgba(255,255,255,.08);color:var(--ivory);border:1px solid var(--line);transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px);border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.gold{background:linear-gradient(135deg,#d3b47e,var(--gold) 55%,#9c7f50);color:var(--navy2);border:0;box-shadow:0 10px 30px rgba(185,154,102,.25)}
.btn.burg{background:var(--burg);border-color:transparent}
.btn.big{font-size:20px;padding:16px 30px;border-radius:18px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}

/* ---------- Welcome ---------- */
.hero{min-height:100%;display:grid;place-items:center;position:relative;text-align:center;padding:40px 20px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:var(--bg) center/cover;opacity:.35;filter:saturate(.8);transform:scale(1.06);animation:kenburns 30s ease-in-out infinite alternate}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(12,24,36,.35),rgba(12,24,36,.94) 75%)}
.hero-in{position:relative;z-index:2;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:16px;animation:rise 1.2s ease both}
.legend{color:var(--muted);font-size:clamp(15px,1.4vw,19px);max-width:760px;margin:6px 0 10px}
.globe{width:140px;height:140px;margin-bottom:4px;filter:drop-shadow(0 0 30px rgba(185,154,102,.35))}
.globe .mer{animation:spin 8s linear infinite;transform-origin:70px 70px}
.route-strip{display:flex;align-items:center;gap:10px;margin-top:18px;opacity:.85}
.route-strip i{color:var(--gold);font-style:normal}
.wait-note{color:var(--muted);font-size:14px}

/* ---------- Посадковий талон (реєстрація) ---------- */
.pass{display:flex;background:var(--ivory);color:var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.35);text-align:left;max-width:560px;width:100%;position:relative}
.pass-l{flex:1;padding:22px 24px;display:flex;flex-direction:column;gap:8px}
.pass-r{width:130px;background:var(--burg);color:var(--ivory);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--mono);font-size:12px;letter-spacing:.15em;border-left:2px dashed rgba(244,239,229,.6);position:relative;text-align:center;padding:10px}
.pass-r b{font-size:34px;letter-spacing:0}
.pass-k{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7b6b55}
.pass input{border:0;border-bottom:2px solid #d9cdb6;background:transparent;font-size:20px;padding:6px 2px;font-weight:700;outline:none}
.pass input:focus{border-color:var(--gold)}
.pass small{color:#7b6b55}
.pass h3{font-size:28px}
.pass .crewlist{display:flex;flex-wrap:wrap;gap:6px}
.pass .crewlist span{background:var(--ivory2);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}

/* ---------- Реєстрація: екіпажі ---------- */
.reg-grid{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
.qr-card{background:var(--ivory);color:var(--ink);border-radius:var(--r);padding:18px;text-align:center}
.qr-card #qr{display:flex;justify-content:center;margin-bottom:10px}
.qr-card .small{font-size:10px;word-break:break-all;color:#6b5d48}
.crews{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.crew{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.crew:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c)}
.crew h3{font-size:24px;margin-bottom:4px}
.crew .code{font-family:var(--mono);font-size:30px;letter-spacing:.3em;color:var(--gold2)}
.crew .cnt{color:var(--muted);font-size:13px;margin:6px 0 10px}
.members{display:flex;flex-wrap:wrap;gap:6px}
.members span{background:rgba(255,255,255,.08);border-radius:999px;padding:4px 10px;font-size:14px;animation:pop .5s ease both}

/* ---------- Карта ---------- */
.mapwrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 380px}
#map{height:100%;background:#0b1622}
.leaflet-container{font-family:var(--sans)}
#map.leaflet-container{background:radial-gradient(ellipse at 50% 40%,#16304a,#0b1622 75%)}
.itin{background:rgba(12,24,36,.92);border-left:1px solid var(--line);padding:26px 22px;overflow:auto}
.itin h2{font-size:34px;margin:6px 0 16px}
.itin ol{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:8px}
.itin li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid transparent;background:rgba(255,255,255,.03)}
.itin li .num{font-family:var(--mono);color:var(--gold);font-size:13px;width:22px}
.itin li b{display:block;font-family:var(--serif);font-size:18px}
.itin li small{color:var(--muted);font-size:12px}
.itin li .st{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
.itin li.done{opacity:.6}.itin li.done .st{color:var(--ok)}
.itin li.next{border-color:var(--gold);background:rgba(185,154,102,.1)}
.itin li.click{cursor:pointer}.itin li.click:hover{border-color:var(--gold)}
.mk{display:flex;flex-direction:column;align-items:center;gap:2px;transform:translate(-50%,-50%);position:absolute}
.mk .pin{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);background:var(--navy);display:grid;place-items:center;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.mk .pin img{width:44px;height:44px;object-fit:cover}
.mk b{font-family:var(--mono);font-size:11px;color:var(--gold2);background:rgba(12,24,36,.85);padding:1px 6px;border-radius:6px;white-space:nowrap}
.mk.todo .pin{filter:grayscale(1) brightness(.7);border-color:rgba(244,239,229,.35)}
.mk.next .pin{animation:ring 1.6s infinite}
.mk.done .pin{border-color:var(--ok)}
.mk.hq .pin{font-size:22px;background:var(--burg)}
.plane{width:34px;height:34px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6));transform:translate(-50%,-50%);position:absolute}
.plane svg{width:100%;height:100%;display:block;transition:transform .15s linear}

/* ---------- Країна ---------- */
.dest{position:absolute;inset:0;display:grid;grid-template-columns:44% 1fr}
.dest-hero{position:relative;background:center/cover;display:flex;align-items:flex-end;padding:36px;overflow:hidden}
.dest-hero:before{content:"";position:absolute;inset:0;background:inherit;background-size:cover;animation:kenburns 26s ease-in-out infinite alternate}
.dest-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,24,36,.1),rgba(12,24,36,.92))}
.dest-head{position:relative;z-index:2;animation:rise 1s ease both}
.dest-head .title{font-size:clamp(44px,5.6vw,88px);margin:12px 0 4px}
.dest-flag img{width:84px;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line);background:rgba(12,24,36,.6);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.dest-body{overflow:auto;padding:30px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;animation:rise .7s ease both}
.card h3{font-size:20px;margin-bottom:8px;color:var(--gold2)}
.card p{margin:0;color:rgba(244,239,229,.88)}
.card.paper{grid-column:1/-1;background:var(--ivory);color:var(--ink)}
.card.paper h3{color:var(--burg)}.card.paper p{color:var(--ink);font-size:18px}
.card.mission{border-color:var(--gold);background:rgba(185,154,102,.1)}
.card.ice{background:rgba(124,68,79,.25)}
.card.secret{border-style:dashed;opacity:.7}
.card.secret.open{opacity:1;border-style:solid;border-color:var(--terra);background:rgba(165,111,99,.22);animation:unseal .8s ease both}
.card .big{font-size:22px;font-family:var(--serif)}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}.card:nth-child(5){animation-delay:.32s}.card:nth-child(6){animation-delay:.4s}

/* ---------- Челендж ---------- */
.ch-head{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.ch-head h2{font-size:clamp(26px,3vw,40px)}
.ch-head .flag{width:64px}
.qcount{margin-left:auto;font-family:var(--mono);color:var(--gold2);font-size:14px;letter-spacing:.1em}
.timer{position:relative;width:96px;height:96px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:8}
.timer .tr-bg{stroke:rgba(255,255,255,.08)}
.timer .tr-fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.timer.low .tr-fg{stroke:var(--bad)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:22px}
.qtext{font-family:var(--serif);font-size:clamp(26px,3.2vw,46px);line-height:1.15;margin:4px 0 26px;max-width:1100px;animation:rise .6s ease both}
.opts.with-img{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:22px;align-items:start}
.qimg{width:100%;border-radius:var(--r);box-shadow:0 20px 40px rgba(0,0,0,.4);max-height:56vh;object-fit:cover}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opts.with-img .opt-grid{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:18px 20px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ivory);font-size:clamp(17px,1.6vw,22px);font-weight:600;position:relative;transition:.2s;animation:rise .5s ease both;min-height:72px}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
.opt:not(:disabled):hover{border-color:var(--gold);background:rgba(185,154,102,.12)}
.opt:disabled{cursor:default}
.opt .ltr{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(185,154,102,.18);color:var(--gold2);font-family:var(--mono);flex:none}
.opt.sel{border-color:var(--gold);background:rgba(185,154,102,.2);box-shadow:0 0 0 2px var(--gold) inset}
.opt.right{border-color:var(--ok);background:rgba(127,163,122,.22);box-shadow:0 0 0 2px var(--ok) inset}
.opt.right .ltr{background:var(--ok);color:#fff}
.opt.wrong{opacity:.45}
.opt.wrong.sel{opacity:.8;box-shadow:0 0 0 2px var(--bad) inset}
.opt .who{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tchip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--c);color:#fff;white-space:nowrap}
.opt-grid.tf{grid-template-columns:1fr 1fr}
.opt-grid.tf .opt{justify-content:center;font-size:clamp(22px,2.4vw,34px);font-family:var(--serif);min-height:120px}
.status{margin-top:22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted)}
.answered{display:flex;gap:8px;flex-wrap:wrap}
.answered .tchip{opacity:.25;transition:.3s}.answered .tchip.on{opacity:1;box-shadow:0 0 18px var(--c)}
.explain{margin-top:20px;padding:16px 20px;border-radius:16px;background:var(--ivory);color:var(--ink);font-size:18px;animation:rise .5s ease both;max-width:1100px}
.verdict{font-family:var(--serif);font-size:24px;margin-top:16px}
.verdict.ok{color:#a9d3a3}.verdict.no{color:#f0a9af}
/* зіставлення */
.match{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.mrow .nm{font-family:var(--serif);font-size:22px;font-weight:700}
.mrow .ltr{font-family:var(--mono);color:var(--gold2);width:26px}
.mrow select{margin-left:auto;max-width:60%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--ivory)}
.mrow.ok{border-color:var(--ok)}.mrow.no{border-color:var(--bad)}
.player .match{grid-template-columns:1fr}
/* творче / бюджет */
.items{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.items span{background:var(--ivory);color:var(--ink);border-radius:12px;padding:8px 14px;font-weight:700;animation:pop .5s ease both}
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.tcard{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:rgba(255,255,255,.04);position:relative}
.tcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);border-radius:4px 0 0 4px}
.tcard h3{font-size:22px;margin-bottom:6px}
.tcard .txt{margin-top:10px;background:var(--ivory);color:var(--ink);border-radius:12px;padding:12px 14px;white-space:pre-wrap}
textarea.big,input.big{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--ivory);padding:14px 16px;font-size:17px;resize:vertical;outline:none}
textarea.big:focus,input.big:focus{box-shadow:0 0 0 3px rgba(185,154,102,.5)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.cat h3{font-size:20px;margin-bottom:8px;color:var(--gold2)}
.bopt{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ivory);font-weight:600}
.bopt.sel{border-color:var(--gold);background:rgba(185,154,102,.2);box-shadow:0 0 0 2px var(--gold) inset}
.bopt .coin{font-family:var(--mono);color:var(--gold2);white-space:nowrap}
.budgetbar{margin:18px 0;height:14px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.budgetbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s}
.budgetbar.over i{background:var(--bad)}

/* ---------- Результати й рейтинг ---------- */
.lb{display:flex;flex-direction:column;gap:12px}
.lrow{display:grid;grid-template-columns:54px 1.2fr 2fr 110px;align-items:center;gap:16px;padding:14px 18px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);animation:rise .6s ease both}
.lrow:nth-child(1){background:linear-gradient(90deg,rgba(185,154,102,.22),rgba(255,255,255,.03));border-color:var(--gold)}
.lrow .rk{font-family:var(--serif);font-size:34px;color:var(--gold2);text-align:center}
.lrow .nm{font-family:var(--serif);font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px}
.lrow .nm small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500}
.lrow .pts{font-family:var(--mono);font-size:28px;text-align:right;color:var(--gold2)}
.bar{height:16px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.bar .b0{background:var(--gold)}.bar .b1{background:var(--terra)}.bar .b2{background:var(--burg)}.bar .b3{background:var(--ivory2)}.bar .bw{background:var(--teal)}

.stamp-banner{display:flex;align-items:center;gap:28px;margin:0 0 26px;padding:18px 24px;border-radius:var(--r);background:var(--ivory);color:var(--ink)}

/* ---------- Штампи і паспорт ---------- */
.stamp{--sc:var(--burg);width:120px;height:120px;border-radius:50%;border:3px solid var(--sc);color:var(--sc);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--mono);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.08em;line-height:1.2;position:relative;transform:rotate(var(--rot,-8deg));opacity:.92;padding:8px;flex:none;background:transparent}
.stamp:before{content:"";position:absolute;inset:5px;border-radius:inherit;border:1.5px dashed var(--sc)}
.stamp b{font-family:var(--serif);font-size:17px;letter-spacing:.02em;text-transform:none;display:block;margin:2px 0}
.stamp.sq{border-radius:14px}.stamp.oval{border-radius:50%/40%;width:140px}
.stamp.drop{animation:stampdrop .7s cubic-bezier(.2,1.6,.4,1) both}
.stamp.empty{--sc:rgba(20,37,54,.18);color:rgba(20,37,54,.3)}

.passports{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:22px}
.passport{display:flex;flex-direction:column;background:var(--ivory);color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 26px 50px rgba(0,0,0,.35)}
.pp-cover{background:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.12),transparent 60%),linear-gradient(160deg,#2c4f9e,#1d3779 55%,#152b64);color:#e4c56c;display:flex;align-items:center;gap:16px;padding:12px 18px}
.pp-cover .tz{width:40px;flex:none}
.pp-cover .t{font-family:var(--sans);font-weight:800;font-size:13px;letter-spacing:.14em;line-height:1.35}
.pp-cover .chip{width:30px;margin-left:auto;flex:none}
.pp-page{padding:16px 18px;background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(20,37,54,.05) 23px 24px),var(--ivory)}
.pp-page h3{font-size:22px;color:var(--navy)}
.pp-page .mem{font-size:12px;color:#6b5d48;margin-bottom:8px}
.pp-stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;justify-items:center;margin:6px 0}
.pp-stamps .stamp{width:84px;height:84px;font-size:7.5px}
.pp-stamps .stamp b{font-size:12px}
.pp-stamps .stamp.oval{width:94px}
.pp-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:8px;border-top:1px dashed #cdbf9f;padding-top:8px}
.pp-foot .tp{font-family:var(--mono);font-size:22px;color:var(--burg);font-weight:700}
.souv{font-size:22px;letter-spacing:2px}

/* ---------- Фінал і листівки-традиції ---------- */
.final-wrap{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.form{display:flex;flex-direction:column;gap:12px}
.form label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2)}

.emo{display:flex;flex-wrap:wrap;gap:6px}
.emo button{font-size:22px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.saved{font-size:12px;color:var(--muted)}
.postcard{background:var(--ivory);color:var(--ink);border-radius:16px;padding:26px 28px;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.35);overflow:hidden;min-height:340px}
.postcard:before{content:"";position:absolute;inset:10px;border:1.5px solid var(--gold);border-radius:10px;pointer-events:none}
.postcard .pc-k{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--burg);padding-right:110px}
.postcard h3{font-size:34px;line-height:1.1;margin:8px 0 6px;color:var(--navy);padding-right:110px}
.postcard .sym{position:absolute;right:30px;top:26px;width:96px;height:96px;border:2px dashed var(--burg);border-radius:8px;display:grid;place-items:center;font-size:44px;transform:rotate(4deg);background:#fff8}
.postcard .desc{font-size:16px;margin:8px 0 12px}
.postcard ol{margin:0 0 12px;padding-left:20px}
.postcard .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
.postcard .meta b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--burg)}
.postcard .postmark{position:absolute;right:26px;bottom:20px;width:96px;height:96px;border-radius:50%;border:2px solid rgba(124,68,79,.55);color:rgba(124,68,79,.75);display:grid;place-items:center;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.1em;transform:rotate(-14deg)}
.postcard .by{font-family:var(--serif);font-style:italic;color:#6b5d48;margin-top:10px;padding-right:110px}
.postcard .meta{padding-right:110px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:22px}
.vote-bar{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
.votes{font-family:var(--mono);font-size:20px;color:var(--gold2)}
.prog{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--gold);transition:width .5s}

/* ---------- Нагородження ---------- */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:18px;align-items:end;margin:10px 0 36px}
.pod{text-align:center;border-radius:20px 20px 0 0;padding:20px 14px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line);animation:rise .9s ease both}
.pod .md{font-size:54px}.pod h3{font-size:26px}.pod .p{font-family:var(--mono);font-size:26px;color:var(--gold2)}
.pod.p1{min-height:290px;border-color:var(--gold);background:linear-gradient(180deg,rgba(185,154,102,.3),rgba(185,154,102,.04));animation-delay:.5s}
.pod.p2{min-height:230px;animation-delay:.25s}.pod.p3{min-height:190px}
.ach{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:34px}
.achc{border-radius:var(--r);padding:18px;background:var(--ivory);color:var(--ink);text-align:center;animation:pop .6s ease both}
.achc .i{font-size:40px}.achc h3{font-size:20px;color:var(--burg)}.achc .w{font-weight:800;font-size:18px;margin-top:6px}
.sec-h{font-size:32px;margin:30px 0 16px}
.cards-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.pcard{background:var(--ivory);color:var(--ink);border-radius:14px;padding:16px;transform:rotate(var(--r,0deg));box-shadow:0 12px 30px rgba(0,0,0,.3)}
.pcard .k{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--burg)}
.pcard .t{font-family:var(--serif);font-size:18px;margin:6px 0}
.pcard .f{font-size:12px;color:#6b5d48}

/* ---------- Оверлеї ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,16,24,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.ov.show{display:flex;animation:fade .3s ease}
.ov-box{background:var(--navy);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:980px;width:100%;max-height:92vh;overflow:auto;position:relative}
.ov-x{position:absolute;right:14px;top:12px;background:none;border:0;color:var(--ivory);font-size:26px}
.wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.wheel{width:min(62vh,440px);height:min(62vh,440px);position:relative}
.wheel svg{width:100%;height:100%;transition:transform 5s cubic-bezier(.12,.8,.12,1)}
.wheel:after{content:"";position:absolute;left:50%;top:-8px;transform:translateX(-50%);border:14px solid transparent;border-top:26px solid var(--gold2);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.wheel-res{min-height:120px;max-width:620px}
.wheel-res h2{font-size:36px}
.wheel-res .pts{font-family:var(--mono);font-size:28px;color:var(--gold2)}
#volBox{position:fixed;top:12px;right:250px;z-index:55;display:flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;background:rgba(12,24,36,.85);border:1px solid var(--line);backdrop-filter:blur(8px);font-family:var(--mono);font-size:12px;color:var(--gold2)}
.mode-screen #volBox{right:24px}
#volBox input{width:150px;accent-color:var(--gold);cursor:pointer}
#volBox .v{min-width:34px;text-align:right;color:var(--ivory)}
#volBox button{background:none;border:0;color:inherit;font-size:16px;cursor:pointer;padding:0}
@media (max-width:900px){#volBox{top:auto;bottom:12px;right:12px}}
.opt .votes{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.vchip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(244,239,229,.14);color:var(--ivory);white-space:nowrap}
.vchip.me{background:var(--gold);color:var(--ink)}
.opt.team::after{content:'відповідь екіпажу';position:absolute;top:-9px;left:16px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:var(--ink);padding:2px 8px;border-radius:999px}
.votelist{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.page.player{padding-bottom:96px}
#chatBtn{position:fixed;right:16px;bottom:16px;z-index:58;width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:var(--ink);font-size:26px;box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:pointer}
#chatBtn .bd{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--bad);color:#fff;font:700 12px/22px var(--sans);padding:0 6px}
#chatBox{position:fixed;right:16px;bottom:86px;z-index:59;width:min(380px,calc(100vw - 32px));height:min(62vh,480px);display:none;flex-direction:column;background:var(--navy);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.55);overflow:hidden}
#chatBox.show{display:flex;animation:fade .2s ease}
#chatBox header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:800;color:var(--gold2)}
#chatBox header button{margin-left:auto;background:none;border:0;color:var(--ivory);font-size:22px;cursor:pointer}
#chatList{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
#chatList .m{max-width:82%;padding:8px 12px;border-radius:14px;background:rgba(244,239,229,.08);color:var(--ivory);font-size:15px;line-height:1.35;word-wrap:break-word;align-self:flex-start}
#chatList .m b{display:block;font-size:11px;color:var(--gold2);margin-bottom:2px}
#chatList .m.me{align-self:flex-end;background:rgba(185,154,102,.28)}
#chatList .m.pending{opacity:.55}
#chatList .empty{color:var(--muted);text-align:center;margin:auto;font-size:14px;padding:0 20px}
#chatForm{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#chatForm input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ivory);font:inherit;font-size:16px}
#chatForm button{border:0;border-radius:12px;background:var(--gold);color:var(--ink);font-weight:800;padding:0 16px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ivory);color:var(--ink);padding:12px 20px;border-radius:14px;font-weight:700;z-index:90;transition:.35s;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ---------- Пульт ведучого ---------- */
.mode-pult #main{padding:12px 12px 0;min-height:0!important;height:auto!important;flex:none!important;overflow:visible}
.mode-pult #app{height:auto!important;min-height:0!important}
body.mode-pult{overflow:auto;height:auto;min-height:100%}
.mode-pult #dock.show{display:block;position:relative;z-index:5;left:auto;right:auto;top:auto;bottom:auto;width:auto;max-height:none;margin:10px 12px 24px;box-shadow:none}
.mode-pult.dock-open #main{margin-right:0}
.mode-pult .route-mini{display:none}
.pult-top{background:rgba(12,24,36,.85);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.pult-st{margin-top:8px;font-size:15px;line-height:1.45;padding:10px 12px;border-radius:12px}
.pult-st.ok{background:rgba(94,140,138,.25);color:var(--ivory)}
.pult-st.warn{background:rgba(185,154,102,.2);color:var(--ivory)}
.pult-st.bad{background:rgba(124,68,79,.45);color:var(--ivory)}
#dock{position:fixed;right:12px;top:76px;bottom:12px;width:360px;z-index:50;background:rgba(10,20,30,.97);border:1px solid var(--gold);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow-y:auto;padding:12px 14px;font-size:14px;display:none}
body.dock-open #main{margin-right:384px}
#dock .nextrow{flex-direction:column;align-items:stretch}
#dock .btn.nextbtn{width:100%}
#dock.busy .nextbtn{opacity:.6;pointer-events:none}

@media (max-width:900px){#dock{left:12px;right:12px;top:auto;width:auto;max-height:48vh}body.dock-open #main{margin-right:0}}
.mode-host #dock.show{display:block}
#dock .drow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid rgba(185,154,102,.15)}
#dock .drow:last-child{border:0}
#dock .nextrow{gap:12px;padding:4px 0 10px}
#dock .nexthint{flex:1;min-width:220px;font-size:15px;color:var(--ivory)}
#dock .btn.nextbtn{font-size:17px;padding:12px 22px;border-radius:14px}
#dock .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);margin-right:6px}
#dock .btn{padding:6px 11px;font-size:13px;border-radius:10px}
#dock .btn.on{background:var(--gold);color:var(--navy2)}

#dock td,#dock th{padding:4px 8px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}
#dock input[type=number]{width:62px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--ivory)}
#dock select,#dock input[type=text]{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--ivory);font-size:13px}
.hint{color:var(--muted);font-size:12px}
.right-ans{color:#a9d3a3;font-weight:700;filter:blur(6px);transition:filter .2s;cursor:help}
.right-ans:hover{filter:none}
.login{display:grid;place-items:center;min-height:100%;padding:20px}

/* ---------- Анімації ---------- */
.noanim *,.noanim *:before{animation:none!important}
.noanim .stamp{opacity:.92}
/* ---------- Паспорт: анімація штампів ---------- */
.pp-ov{background:radial-gradient(ellipse at 50% 45%,rgba(28,51,73,.92),rgba(5,10,16,.97) 70%);z-index:70;flex-direction:column;cursor:pointer}
#ppStage{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;perspective:2400px}
.ppbook{--w:clamp(150px,30vw,400px);--h:calc(var(--w) * 1.42);position:relative;width:calc(var(--w) * 2);height:var(--h);transform-style:preserve-3d;transform:translateX(calc(var(--w) * -.5)) rotateX(10deg) scale(.82);opacity:0;transition:transform 1.25s cubic-bezier(.45,.05,.2,1),opacity .5s ease}
.ppbook.show{opacity:1;transform:translateX(calc(var(--w) * -.5)) rotateX(10deg) scale(.9)}
.ppbook.open{transform:none;opacity:1}
.pppage{position:absolute;top:0;width:var(--w);height:var(--h);overflow:hidden}
.pppage.right{left:var(--w);border-radius:3px 16px 16px 3px;box-shadow:0 30px 60px rgba(0,0,0,.55)}
.ppcover{position:absolute;left:var(--w);top:0;width:var(--w);height:var(--h);transform-origin:left center;transform-style:preserve-3d;transition:transform 1.35s cubic-bezier(.55,.05,.22,1)}
.ppbook.open .ppcover{transform:rotateY(-180deg)}
.ppcover .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.ppcover .front{border-radius:3px 16px 16px 3px;background:radial-gradient(ellipse at 28% 18%,rgba(255,255,255,.13),transparent 55%),repeating-linear-gradient(35deg,rgba(255,255,255,.02) 0 2px,rgba(0,0,0,.025) 2px 4px),linear-gradient(160deg,#2c4f9e,#1d3779 55%,#152b64);box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.25),inset 10px 0 22px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:11% 8% 8%;color:#e4c56c;text-align:center}
.ppcover .back{transform:rotateY(180deg);border-radius:16px 3px 3px 16px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.ppc-t{font-family:var(--sans);font-weight:800;letter-spacing:.14em;font-size:calc(var(--w) * .082);line-height:1.3;text-shadow:0 1px 0 rgba(0,0,0,.35),0 0 12px rgba(228,197,108,.25)}
.ppc-tz{width:36%;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.ppc-chip{width:14%;opacity:.95}
.pp-loader{display:flex;flex-direction:column;align-items:center;gap:28px}
.pp-float{animation:ppfloat 2.4s ease-in-out infinite}
.pp-loader .ppbook{opacity:1;transform:none;width:var(--w)}
.pp-loader .ppcover{left:0}
.pp-loader .pppage{display:none}
.pp-load-t{font-family:var(--serif);font-size:clamp(22px,2.6vw,38px);color:var(--ivory);text-align:center}
.pp-load-t small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:var(--gold2);margin-bottom:10px}
.pp-dots:after{content:'';animation:ppdots 1.4s steps(4) infinite}
@keyframes ppdots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@keyframes ppfloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
#dock.busy button{pointer-events:none;opacity:.55}
.ppc-game{font-family:var(--mono);font-size:calc(var(--w) * .028);letter-spacing:.22em;opacity:.55}
.ppvisa{background:radial-gradient(circle at 50% 56%,rgba(110,160,150,.10) 0 28%,transparent 29%),repeating-radial-gradient(circle at 50% 56%,rgba(80,125,135,.075) 0 1px,transparent 1px 7px),repeating-linear-gradient(118deg,rgba(150,110,140,.05) 0 1px,transparent 1px 9px),repeating-linear-gradient(62deg,rgba(110,150,120,.05) 0 1px,transparent 1px 11px),linear-gradient(180deg,#f4f2ea,#e9eee6)}
.ppvisa .ppv-h{position:absolute;top:5%;font-family:var(--mono);font-size:calc(var(--w) * .034);letter-spacing:.14em;color:#7d8a86}
.pppage.right .ppv-h,.ppcover .back .ppv-h{left:8%}
.ppvisa .ppv-n{position:absolute;bottom:3.5%;font-family:var(--mono);font-size:calc(var(--w) * .04);color:#9aa39c}
.pppage.right .ppv-n{right:8%}.ppcover .back .ppv-n{left:8%}
.ppvisa .ppv-wm{position:absolute;left:50%;top:56%;width:46%;transform:translate(-50%,-50%);opacity:.07}
.pppage.right:after{content:"";position:absolute;inset:0 auto 0 0;width:16%;background:linear-gradient(90deg,rgba(0,0,0,.16),transparent)}
.ppcover .back:after{content:"";position:absolute;inset:0 0 0 auto;width:16%;background:linear-gradient(270deg,rgba(0,0,0,.16),transparent)}
.ppst{position:absolute;width:43%;transform:translate(-50%,-50%) rotate(var(--r));mix-blend-mode:multiply;opacity:.92;pointer-events:none}
.ppst.hidden{opacity:0}
.ppst-svg{width:46%;height:auto}
.woodst{position:absolute;z-index:5;pointer-events:none;filter:drop-shadow(0 18px 18px rgba(0,0,0,.45));transform-origin:50% 100%}
.inkdot{position:absolute;border-radius:50%;pointer-events:none;z-index:4}
.pp-cap{text-align:center;opacity:0;transform:translateY(12px);transition:.6s ease;max-width:90vw}
.pp-cap.show{opacity:1;transform:none}
.pp-cap .eyebrow{margin-bottom:6px}
.pp-cap h2{font-size:clamp(24px,3vw,44px)}
.pp-cap p{color:var(--muted);margin:6px 0 0;font-size:clamp(14px,1.4vw,19px)}
.pp-skip{position:absolute;right:22px;bottom:18px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--muted);opacity:.7}
.stampimg{width:120px;height:120px;object-fit:contain;transform:rotate(var(--rot,-6deg));mix-blend-mode:multiply;flex:none}
.stampimg.drop{animation:stampdrop .7s cubic-bezier(.2,1.6,.4,1) both}
.pp-stamps .stampimg{width:88px;height:88px}
@media (max-width:900px){.ppbook{--w:43vw}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes kenburns{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-1%,-1%)}}
@keyframes pulse{50%{opacity:.55}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(185,154,102,.7)}100%{box-shadow:0 0 0 18px rgba(185,154,102,0)}}
@keyframes stampdrop{0%{opacity:0;transform:scale(2.6) rotate(-30deg)}70%{opacity:1;transform:scale(.92) rotate(var(--rot,-8deg))}100%{transform:scale(1) rotate(var(--rot,-8deg))}}
@keyframes unseal{0%{transform:rotateX(70deg);opacity:0}100%{transform:none;opacity:1}}

/* ---------- Телефони (гравці) ---------- */
@media (max-width:900px){
  body{overflow:auto}
  #hud{padding:10px 14px;gap:8px;flex-wrap:wrap}
  .route-mini{display:none}
  #hud{flex-wrap:nowrap}
  .brand{display:none}
  .hud-r{width:100%;justify-content:flex-end;min-width:0}
  .team-chip{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
  .mrow{flex-wrap:wrap}.mrow select{max-width:100%;width:100%;margin-left:0}
  #main{overflow-x:hidden}
  .page{padding:22px 16px 80px}
  .reg-grid,.final-wrap,.match,.opts.with-img{grid-template-columns:1fr}
  .mapwrap{position:relative;display:block}
  #map{height:52vh}
  .itin{border:0}
  .dest{position:relative;display:block}
  .dest-hero{min-height:300px;padding:22px}
  .dest-body{grid-template-columns:1fr;padding:16px}
  .opt-grid{grid-template-columns:1fr}
  .opt-grid.tf{grid-template-columns:1fr 1fr}
  .ch-head{flex-wrap:wrap}.timer{width:72px;height:72px}.timer b{font-size:17px}
  .lrow{grid-template-columns:40px 1fr 80px}.lrow .bar{grid-column:1/-1}
  .podium{grid-template-columns:1fr}
  .gallery,.passports{grid-template-columns:1fr}
  .pass{flex-direction:column}.pass-r{width:auto;flex-direction:row;border-left:0;border-top:2px dashed rgba(244,239,229,.6);padding:12px}
  .postcard h3{font-size:26px;padding-right:90px}.postcard .sym{width:76px;height:76px;font-size:34px}
}

<script>
/* ===== Версія гри для GitHub Pages =====
   Стан гри миттєво розходиться через Firebase Realtime Database.
   «Рушій» гри (той самий код, що в Code.js) працює у вкладці пульта ведучого:
   він рахує бали, перемикає питання й публікує стан для екіпажів.
   Apps Script лишається для таблиці: налаштування, музика, журнали, листівки.
   Цей файл вставляє в сторінку скрипт github_збірка.js. */
(function () {
  const API = "https://script.google.com/macros/s/AKfycbzRBXCCwgGKkUM9Iwjhmj7k0IYQtUWfHUU2QVPOT2E29bXJ5oHPgClTrn1qWL3VEAsYnw/exec";                 // адреса Apps Script
  const FB = {"apiKey":"AIzaSyDePWs_XcksqmA2XAfi94u4xE_zVQJUTyA","authDomain":"valid-complex-494210-i3.firebaseapp.com","databaseURL":"https://valid-complex-494210-i3-default-rtdb.europe-west1.firebasedatabase.app","projectId":"valid-complex-494210-i3","storageBucket":"valid-complex-494210-i3.firebasestorage.app","messagingSenderId":"830130192536","appId":"1:830130192536:web:40c9929a94559d6e4310ed"};            // налаштування Firebase (null — режим лише через Apps Script)
  const GAME = "\n/* ================= ДАНІ Й СТАН ================= */\nconst MODE = window.__MODE;\nlet CFG = window.__CFG;\nconst IS_PULT = MODE === 'pult';                // пульт з телефона: лише кнопки, без великого екрана й музики\nconst IS_HOST = MODE === 'host' || IS_PULT, IS_SCREEN = MODE === 'screen', IS_PLAYER = MODE === 'player';\nconst NC = CFG.countries.length;              // номер «етапу» фінальної місії\nconst P = CFG.settings.pts;\nconst YEAR = new Date().getMonth() >= 8 ? new Date().getFullYear() + 1 : new Date().getFullYear();\nconst STAMP_COLORS = ['#7C444F', '#142536', '#A56F63', '#8a6d3b', '#5E8C8A', '#7C444F'];\nconst STAMP_SHAPES = ['', 'sq', 'oval', '', 'sq', 'oval'];\n\n/* Безпечне сховище браузера (може бути недоступне) */\nconst store = {\n  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },\n  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }\n};\nlet ME = store.get('catw_me') || {};            // {playerId, teamId, name}\nlet PIN = ''; try { PIN = sessionStorage.getItem('catw_pin') || ''; } catch (e) {}\nlet TV = {}, CHAT = [], CV = '';                  // голоси екіпажу за поточне питання, чат екіпажу\nlet S = null, SC = {}, ANS = {}, MINE = {}, FIN = {}, VOTES = {}, CARDS = [], RIGHT = null, EXPLAIN = '', VER = 0, OFF = 0;\nconst DRAFT = {};                               // те, що гравець набрав, але ще не надіслав\nlet dockOpen = true, soundOn = !IS_PLAYER && !IS_PULT;\n\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s == null ? '' : s).replace(/[&\u003c>\"']/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst flag = (code, w) => code === 'hq' ? '\u003cspan class=\"flag-hq\">🌍\u003c/span>' : '\u003cimg class=\"flag\" src=\"https://flagcdn.com/w' + (w > 80 ? 160 : 80) + '/' + code + '.png\" style=\"width:' + w + 'px\" alt=\"\">';\nconst team = id => S && S.teams.find(t => t.id === id);\nconst myTeam = () => ME.teamId ? team(ME.teamId) : null;\nconst sum = s => s ? (+s.correct || 0) + (+s.speed || 0) + (+s.team || 0) + (+s.bonus || 0) : 0;\nconst tchip = t => '\u003cspan class=\"tchip\" style=\"--c:' + t.color + '\">' + esc(t.name) + '\u003c/span>';\nconst emojiOf = s => (String(s || '').match(/^\\S+/) || [''])[0];\n\n/* ================= ЗВ'ЯЗОК ІЗ СЕРВЕРОМ ================= */\nfunction call(fn, ...args) {\n  return new Promise((res, rej) => {\n    google.script.run.withSuccessHandler(res).withFailureHandler(e => { toast('⚠️ ' + (e && e.message || e)); rej(e); })[fn](...args);\n  });\n}\n/* Дія ведучого */\n/* Екран змінюється одразу (передбачаємо результат), а відповідь сервера потім лише уточнює його */\nlet actPending = 0;\nconst HEAVY = { finishChallenge: 'Рахуємо бали…', saveStage: 'Видаємо штампи…', finalScores: 'Рахуємо фінальні бали…', awards: 'Готуємо нагородження…', reset: 'Починаємо нову гру…' };\nfunction act(action, p) {\n  p = p || {};\n  if (actPending && !/^timer/.test(action)) return; // поки попередня дія не завершилась, нові кліки ігноруємо\n  sfxClick();\n  actPending++;\n  $('#dock').classList.add('busy');\n  let real = action;\n  if (action === 'next' && S) { const n = nextStep(); real = n.action || 'noop'; predict(real, n.p || {}); }\n  else if (action === 'nextQuestion' && S) { real = 'gotoQuestion'; predict(real, { q: S.q + 1 }); }\n  else predict(action, p);\n  if (IS_PULT) {}\n  else if (real === 'saveStage') showStampLoader('Проставляються штампи на кордоні', 'Passport control');\n  else if (real === 'awards') showStampLoader('Митний контроль: підсумовуємо експедицію', 'Final border');\n  else if (HEAVY[real]) toast(HEAVY[real]);\n  return call('hostAction', PIN, action, p)\n    .then(r => {\n      actPending--;\n      if (r && r.state) onState(r, true); else poll(true);\n      // запис результатів у таблицю — у фоні, щоб гра не чекала\n      if (r && r.did === 'saveStage') google.script.run.withFailureHandler(() => {}).hostAction(PIN, 'writeLogs', { stage: r.didStage });\n      if (r && r.did === 'awards') google.script.run.withFailureHandler(() => {}).hostAction(PIN, 'writeLogs', { final: true });\n      if (!ppBusy) hideStampLoader();\n    })\n    .catch(() => { actPending--; hideStampLoader(); poll(true); })\n    .finally(() => { if (!actPending) $('#dock').classList.remove('busy'); });\n}\nfunction predict(action, p) {\n  if (!S) return;\n  const s = JSON.parse(JSON.stringify(S)), now = Date.now() + OFF;\n  const noTimer = { end: 0, left: 0, total: 0, running: false };\n  const openQ = q => {\n    const r = CFG.countries[s.stage] && CFG.countries[s.stage].rounds[q];\n    s.phase = 'challenge'; s.q = q; s.qOpen = true; s.qReveal = false; s.answered = [];\n    s.timer = r ? { end: now + r.secs * 1000 + 2500, left: r.secs * 1000 + 2500, total: r.secs * 1000 + 2500, running: true } : noTimer;\n    RIGHT = null; EXPLAIN = '';\n  };\n  switch (action) {\n    case 'goto': s.phase = p.phase; s.showCards = false; if (p.phase !== 'challenge') s.qOpen = false; break;\n    case 'openRegistration': s.phase = 'registration'; break;\n    case 'openStage': s.stage = +p.stage; s.q = 0; s.qOpen = false; s.qReveal = false; s.secret = false; s.answered = []; s.phase = 'destination'; s.showCards = false; s.timer = noTimer; break;\n    case 'startChallenge': openQ(+(p.q || 0)); break;\n    case 'gotoQuestion': openQ(+p.q); break;\n    case 'reveal': {\n      const r = CFG.countries[s.stage].rounds[s.q];\n      s.qOpen = false; s.qReveal = true; s.timer = noTimer;\n      RIGHT = r.type === 'match' ? r.rightList : (r.right === undefined ? null : r.right); EXPLAIN = r.explain || '';\n      break;\n    }\n    case 'closeQuestion': s.qOpen = false; s.timer = Object.assign({}, s.timer, { running: false, left: 0 }); break;\n    case 'toggleSecret': s.secret = !s.secret; break;\n    case 'toggleCards': s.showCards = !s.showCards; if (s.showCards) s.cardsSeq = (s.cardsSeq || 0) + 1; break;\n    case 'wheelClose': s.wheel = null; break;\n    case 'openFinal': s.stage = NC; s.phase = 'final'; s.showCards = false; break;\n    case 'openVoting': s.phase = 'voting'; break;\n    default: return;\n  }\n  S = s;\n  render();\n}\n\n/* Прибрати стіну листівок: ведучий ховає її для всіх, гравець лише у себе */\nlet wallClosedSeq = -1;\nfunction closeWall() {\n  hideOv('ovWall');\n  wallClosedSeq = S ? (S.cardsSeq || 0) : -1;\n  if (IS_HOST && S && S.showCards) act('toggleCards');\n}\n\n// Сайт регулярно питає сервер «що нового?». Якщо відповідь загубилась (телефон заснув, зник інтернет),\n// через 8 секунд питаємо знову, а раз на 10 секунд беремо повну свіжу картину гри.\nlet pollTimer = null, inFlight = false, inFlightAt = 0, lastFull = 0, lastPollAt = Date.now();\nfunction poll(force) {\n  if (inFlight && !force && Date.now() - inFlightAt \u003c 6000) return;\n  const my = inFlightAt = lastPollAt = Date.now();\n  inFlight = true; clearTimeout(pollTimer);\n  const full = force || Date.now() - lastFull > 10000;\n  if (full) lastFull = Date.now();\n  google.script.run\n    .withSuccessHandler(r => { if (my === inFlightAt) inFlight = false; try { if (!actPending) onState(r); } finally { schedule(); } })\n    .withFailureHandler(() => { if (my === inFlightAt) inFlight = false; schedule(4000); })\n    .getState(full ? 0 : VER, IS_PLAYER ? (ME.teamId || '') : '', IS_PLAYER ? '' : PIN, CV);\n}\nfunction schedule(ms) {\n  clearTimeout(pollTimer);\n  const quick = S && (S.phase === 'challenge' || S.phase === 'destination' || S.phase === 'voting');\n  pollTimer = setTimeout(poll, ms || (IS_PLAYER ? (document.hidden ? 8000 : (quick || chatOpen ? 1200 : 2500)) : 1500));\n}\n// сторожа: якщо опитування з якоїсь причини зупинилось — запускаємо знову\nsetInterval(() => { if (Date.now() - lastPollAt > (document.hidden ? 15000 : 6000)) poll(); }, 3000);\ndocument.addEventListener('visibilitychange', () => { if (!document.hidden) poll(true); });\nwindow.addEventListener('online', () => poll(true));\nwindow.addEventListener('focus', () => poll());\n\nfunction onState(r, fromAct) {\n  OFF = r.now - Date.now();\n  if (r.chat) { CHAT = r.chat; CV = r.cv || ''; renderChat(); }\n  if (r.same) return;\n  if (!fromAct && S && r.state && r.state.v \u003c VER) return; // застаріла відповідь\n  S = r.state; VER = S.v; SC = r.scores || {}; ANS = r.answers || {}; MINE = r.mine || {}; TV = r.tv || {};\n  FIN = r.final || {}; VOTES = r.votes || {}; CARDS = r.cards || [];\n  RIGHT = r.right === undefined ? null : r.right; EXPLAIN = r.explain || '';\n  // Знаходимо свій екіпаж за id гравця (ведучий міг перемістити або гру скинули)\n  if (IS_PLAYER && ME.playerId) {\n    const t = S.teams.find(x => x.members.some(m => m.id === ME.playerId));\n    const tid = t ? t.id : '';\n    if (tid !== ME.teamId) { ME.teamId = tid; store.set('catw_me', ME); CHAT = []; CV = ''; }\n  }\n  render();\n  resendLost();\n  renderChatBtn();\n}\n\n/* ================= МАЛЮВАННЯ ================= */\nlet lastHard = '', lastSoft = '';\nfunction viewName() {\n  if (!S) return 'loading';\n  if (IS_HOST && !PIN) return 'login';\n  if (IS_PULT) return 'pult';\n  if (IS_PLAYER && !ME.teamId) return 'join';\n  return S.phase;\n}\nfunction render(force) {\n  renderHud(); renderDock(); if (!IS_PULT) renderOverlays();\n  if (!IS_PLAYER && !IS_PULT && S && (PIN || IS_SCREEN)) syncMusic();\n  const v = viewName();\n  const hard = [v, S && S.stage, S && S.q, S && S.qOpen, S && S.qReveal, S && S.secret, ME.teamId, S && S.teams.length].join('|');\n  const soft = S ? JSON.stringify([S.teams, IS_PLAYER ? 0 : S.answered, S.completed, SC, IS_PLAYER ? [MINE, TV] : ANS, FIN, VOTES, S.passport, S.items, RIGHT, S.timer.total]) : '';\n  if (!force && hard === lastHard && soft === lastSoft) return;\n  const ae = document.activeElement;\n  const typing = ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && $('#main').contains(ae);\n  if (!force && hard === lastHard && typing) { lastSoft = soft; softPatch(); return; }\n  const isNew = hard !== lastHard;\n  // телефон / екран: якщо зараз буде анімація штампа — спершу показуємо паспорт, а рейтинг під ним малюємо трохи згодом\n  if (isNew && !IS_HOST && v === 'leaderboard' && stampDue()) { maybeStampAnim(v); setTimeout(() => render(true), 300); return; }\n  const prevView = lastHard.split('|')[0];\n  lastHard = hard; lastSoft = soft;\n  const main = $('#main'), sc = main.scrollTop;\n  main.classList.toggle('noanim', !isNew); // при дрібних оновленнях не повторюємо анімації появи\n  if (!(v === 'map' && !isNew && MAP)) main.innerHTML = (V[v] || V.loading)();\n  else softPatch();\n  if (!isNew) main.scrollTop = sc; else main.scrollTop = 0;\n  if (AFTER[v]) AFTER[v](isNew, prevView);\n  if (isNew) onPhaseSfx(v);\n  if (isNew) maybeStampAnim(v);\n  tick();\n}\n/* Оновлює лише «живі» шматки сторінки, не чіпаючи поле, в якому гравець друкує */\nfunction softPatch() {\n  document.querySelectorAll('[data-soft]').forEach(el => { const f = SOFT[el.dataset.soft]; if (f) el.innerHTML = f(); });\n}\nconst SOFT = {}, AFTER = {}, V = {};\n\n/* ---------- Верхня панель ---------- */\nfunction renderHud() {\n  if (!S) { $('#hud').innerHTML = '\u003cdiv class=\"brand\">\u003ci>✦\u003c/i>\u003cspan>' + esc(CFG.settings.title) + '\u003c/span>\u003c/div>'; return; }\n  const cur = S.phase === 'destination' || S.phase === 'challenge' || S.phase === 'results' ? S.stage : -1;\n  const route = CFG.countries.map((c, i) =>\n    '\u003cspan class=\"rm ' + (S.completed.indexOf(i) >= 0 ? 'done' : '') + (cur === i ? ' cur' : '') + '\" title=\"' + esc(c.name) + '\">\u003cimg src=\"https://flagcdn.com/w80/' + c.code + '.png\" alt=\"\">\u003c/span>'\n  ).join('\u003cspan class=\"dash\">\u003c/span>') + '\u003cspan class=\"dash\">\u003c/span>\u003cspan class=\"hqm ' + (S.stage >= NC ? 'cur' : '') + '\">🌍\u003c/span>';\n  let right = '\u003cspan class=\"pill\" id=\"hudTimer\" hidden>\u003c/span>';\n  const t = myTeam();\n  if (IS_PLAYER && t) {\n    right += '\u003cspan class=\"team-chip\">\u003cspan class=\"dot\" style=\"--c:' + t.color + '\">\u003c/span>' + esc(t.name) + ' · \u003cspan class=\"mono\">' + teamTotal(t.id) + '\u003c/span>\u003c/span>'\n      + '\u003cbutton class=\"ibtn\" onclick=\"openPassport()\" title=\"Паспорт\">🛂\u003c/button>\u003cbutton class=\"ibtn\" onclick=\"openComposer()\" title=\"Листівка колезі\">💌\u003c/button>';\n  }\n  if (IS_HOST && PIN && !IS_PULT) right += '\u003cbutton class=\"ibtn\" onclick=\"toggleSound()\">' + (soundOn ? '🔊' : '🔇') + '\u003c/button>\u003cbutton class=\"ibtn\" onclick=\"toggleDock()\">⚙ Пульт\u003c/button>';\n  $('#hud').innerHTML = '\u003cdiv class=\"brand\">\u003ci>✦\u003c/i>\u003cspan>' + esc(CFG.settings.title) + '\u003c/span>\u003c/div>\u003cdiv class=\"route-mini\">' + route + '\u003c/div>\u003cdiv class=\"hud-r\">' + right + '\u003c/div>';\n  tick();\n}\n\n/* ---------- Таймер (оновлюється 4 рази на секунду) ---------- */\nfunction tLeft() { const t = S && S.timer; if (!t || !t.total) return 0; return t.running ? Math.max(0, t.end - (Date.now() + OFF)) : t.left; }\nfunction fmt(ms) { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }\nfunction timerRing() {\n  return '\u003cdiv class=\"timer\" data-timer>\u003csvg viewBox=\"0 0 120 120\">\u003ccircle class=\"tr-bg\" cx=\"60\" cy=\"60\" r=\"52\"/>\u003ccircle class=\"tr-fg\" cx=\"60\" cy=\"60\" r=\"52\" stroke-dasharray=\"326.7\" stroke-dashoffset=\"0\"/>\u003c/svg>\u003cb>0:00\u003c/b>\u003c/div>';\n}\nlet lastSec = -1;\nfunction tick() {\n  if (!S) return;\n  const left = tLeft(), total = S.timer.total || 1;\n  document.querySelectorAll('[data-timer]').forEach(el => {\n    el.querySelector('b').textContent = S.timer.total ? fmt(left) : '—';\n    el.querySelector('.tr-fg').setAttribute('stroke-dashoffset', String(326.7 * (1 - left / total)));\n    el.classList.toggle('low', S.timer.total > 0 && left \u003c 6000);\n  });\n  const ht = $('#hudTimer');\n  if (ht) {\n    ht.hidden = !S.timer.total;\n    ht.textContent = '⏱ ' + fmt(left) + (S.timer.running ? '' : (left ? ' ⏸' : ''));\n    ht.classList.toggle('warn', S.timer.total > 0 && left > 0 && left \u003c 6000);\n  }\n  const sec = Math.ceil(left / 1000);\n  if (sec !== lastSec) {\n    if (S.timer.running && sec > 0 && sec \u003c= 5) sfxTick();\n    if (S.timer.running && sec === 0 && lastSec === 1) sfxEnd();\n    // гравцям блокуємо кнопки, коли час вийшов\n    const ended = IS_PLAYER && S.phase === 'challenge' && S.timer.running && sec === 0 && lastSec > 0;\n    lastSec = sec; // спершу запам'ятовуємо секунду, інакше перемальовка знову викликає tick і сторінка зациклюється\n    if (ended) render(true);\n  }\n}\nsetInterval(tick, 250);\n\n/* ================= ЕКРАНИ ================= */\nV.loading = () => '\u003cdiv class=\"login\">\u003cdiv class=\"eyebrow\">Завантаження експедиції…\u003c/div>\u003c/div>';\n\n/* ---------- Вхід ведучого ---------- */\n/* ---------- Пульт з телефона ---------- */\nV.pult = () => '\u003csection class=\"pult-top\">\u003cdiv class=\"eyebrow\">📱 Пульт ведучого\u003c/div>'\n  + '\u003cdiv id=\"pultStatus\" data-soft=\"pultStatus\">' + SOFT.pultStatus() + '\u003c/div>'\n  + '\u003cp class=\"small\" style=\"opacity:.7;margin-top:8px\">Гравці бачать гру на вашій демонстрації екрана. Кнопки керування — нижче.\u003c/p>\u003c/section>';\nSOFT.pultStatus = () => {\n  const e = window.__engineInfo ? window.__engineInfo() : { alive: true, me: false };\n  const t = S && S.phase === 'challenge' ? ' · питання ' + (S.q + 1) + ', відповіли ' + S.answered.length + ' з ' + S.teams.length : '';\n  const wheel = S && S.wheel ? '\u003cbutton class=\"btn\" style=\"margin-top:8px\" onclick=\"act(\\'wheelClose\\')\">🎡 Закрити колесо на екрані\u003c/button>' : '';\n  if (e.me) return '\u003cdiv class=\"pult-st warn\">Гра працює з цього телефона. Не блокуйте екран і не перемикайтеся на інші застосунки.\u003c/div>' + wheel;\n  if (!e.alive) return '\u003cdiv class=\"pult-st bad\">⚠️ Голо "8\" y1=\"70\" x2=\"132\" y2=\"70\"/>'\n    + '\u003cg class=\"mer\">' + [10, 28, 46].map(x => '\u003cellipse cx=\"70\" cy=\"70\" rx=\"' + x + '\" ry=\"62\"/>').join('') + '\u003cline x1=\"70\" y1=\"8\" x2=\"70\" y2=\"132\"/>\u003c/g>\u003c/g>'\n    + '\u003cpath d=\"M18 52 Q70 10 122 46\" stroke=\"#D8BE8C\" stroke-width=\"1.6\" stroke-dasharray=\"3 5\" fill=\"none\"/>\u003ctext x=\"112\" y=\"44\" font-size=\"14\" fill=\"#D8BE8C\">✈\u003c/text>\u003c/svg>';\n}\n\n/* ---------- 01 Welcome ---------- */\nV.welcome = () => '\u003csection class=\"hero\" style=\"--bg:url(\\'' + CFG.settings.cover + '\\')\">\u003cdiv class=\"hero-in\">' + globeSVG()\n  + '\u003cdiv class=\"eyebrow\">Expedition · New Year ' + YEAR + ' · Boarding now\u003c/div>'\n  + '\u003ch1 class=\"title\">' + esc(CFG.settings.title) + '\u003c/h1>\u003cdiv class=\"subtitle\">' + esc(CFG.settings.subtitle) + '\u003c/div>'\n  + '\u003cp class=\"legend\">' + esc(CFG.settings.legend) + '\u003c/p>'\n  + (IS_HOST ? '\u003cbutton class=\"btn gold big\" onclick=\"act(\\'openRegistration\\')\">Start Journey ✈\u003c/button>' : '')\n  + '\u003cdiv class=\"route-strip\">' + CFG.countries.map(c => flag(c.code, 34)).join('\u003ci>· · ·\u003c/i>') + '\u003ci>· · ·\u003c/i>\u003cspan style=\"font-size:26px\">🌍\u003c/span>\u003c/div>'\n  + '\u003c/div>\u003c/section>';\n\n/* ---------- Гравець: посадковий талон для входу ---------- */\nV.join = () => {\n  const open = S && S.teams.length;\n  return '\u003csection class=\"hero\" style=\"--bg:url(\\'' + CFG.settings.cover + '\\')\">\u003cdiv class=\"hero-in\">'\n    + '\u003cdiv class=\"eyebrow\">' + esc(CFG.settings.subtitle) + '\u003c/div>\u003ch1 class=\"title\" style=\"font-size:clamp(36px,9vw,72px)\">' + esc(CFG.settings.title) + '\u003c/h1>'\n    + '\u003cdiv class=\"pass\">\u003cdiv class=\"pass-l\">\u003cdiv class=\"pass-k\">Boarding pass · Passenger\u003c/div>'\n    + '\u003cinput id=\"jName\" data-draft=\"jName\" placeholder=\"Ваш нік\" maxlength=\"40\" value=\"' header class=\"ph\">\u003cdiv class=\"eyebrow\">Crew formation · Check-in\u003c/div>\u003ch2>Формуємо екіпажі\u003c/h2>'\n    + '\u003cp>Відкрийте посилання на телефоні, введіть свій нік і код екіпажу. Без коду — розподілимо випадково.\u003c/p>\u003c/header>'\n    + '\u003cdiv class=\"reg-grid\">\u003cdiv class=\"qr-card\">\u003cdiv id=\"qr\">\u003c/div>\u003cdiv class=\"mono small\">' + esc(CFG.url || '') + '\u003c/div>\u003c/div>'\n    + '\u003cdiv class=\"crews\" data-soft=\"crews\">' + SOFT.crews() + '\u003c/div>\u003c/div>\u003c/section>';\n};\nAFTER.registration = () => {\n  const el = $('#qr');\n  if (el && window.QRCode && CFG.url) { el.innerHTML = ''; new QRCode(el, { text: CFG.url, width: 200, height: 200, colorDark: '#142536', colorLight: '#F4EFE5' }); }\n};\nfunction myPassView() {\n  const t = myTeam();\n  return '\u003csection class=\"page\" style=\"display:grid;place-items:center\">\u003cdiv class=\"pass\">\u003cdiv class=\"pass-l\">\u003cdiv class=\"pass-k\">Boarding pass · Crew\u003c/div>'\n    + '\u003ch3>' + esc(t.name) + '\u003c/h3>\u003cdiv class=\"pass-k\">Пасажир\u003c/div>\u003cb style=\"font-size:20px\">' + esc(ME.name) + '\u003c/b>'\n    + '\u003cdiv class=\"pass-k\" style=\"margin-top:6px\">Ваш екіпаж\u003c/div>\u003cdiv class=\"crewlist\" data-soft=\"crewlist\">' + SOFT.crewlist() + '\u003c/div>'\n    + '\u003csmall style=\"margin-top:8px\">Чекаємо на зліт… Ведучий скоро відкриє карту маршруту.\u003c/small>'\n    + '\u003cbutton class=\"btn sm\" style=\"align-self:flex-start;background:#e8dfcd;color:#1b2735\" onclick=\"changeCrew()\">Змінити екіпаж\u003c/button>'\n    + '\u003c/div>\u003cdiv class=\"pass-r\">\u003cspan>CODE\u003c/span>\u003cb style=\"font-size:24px;letter-spacing:.15em\">' + t.code + '\u003c/b>\u003cspan>✈ ' + YEAR + '\u003c/span>\u003c/div>\u003c/div>\u003c/section>';\n}\nSOFT.crewlist = () => { const t = myTeam(); return t ? t.members.map(m => '\u003cspan>' + esc(m.name) + '\u003c/span>').join('') : ''; };\n\n/* ---------- 03 Карта маршруту ---------- */\nfunction nextStage() { for (let i = 0; i \u003c NC; i++) if (S.completed.indexOf(i) \u003c 0) return i; return NC; }\nSOFT.itin = () => {\n  const nx = nextStage();\n  return CFG.countries.map((c, i) => {\n    const done = S.completed.indexOf(i) >= 0, next = i === nx;\n    return '\u003cli class=\"' + (done ? 'done' : '') + (next ? ' next' : '') + (IS_HOST ? ' click' : '') + '\"' + (IS_HOST ? ' onclick=\"act(\\'openStage\\',{stage:' + i + '})\"' : '') + '>'\n      + '\u003cspan class=\"num\">0' + (i + 1) + '\u003c/span>' + flag(c.code, 34) + '\u003cdiv>\u003cb>' + esc(c.name) + '\u003c/b>\u003csmall>' + esc(c.stop) + ' · ' + esc(c.kind) + ' · ' + c.minutes + ' хв\u003c/small>\u003c/div>'\n      + '\u003cspan class=\"st\">' + (done ? '✓ stamp' : next ? 'next' : '') + '\u003c/span>\u003c/li>';\n  }).join('') + '\u003cli class=\"' + (nx === NC ? 'next' : '') + (IS_HOST ? ' click' : '') + '\"' + (IS_HOST ? ' onclick=\"act(\\'openFinal\\')\"' : '') + '>\u003cspan class=\"num\">★\u003c/span>\u003cspan style=\"font-size:26px\">🌍\u003c/span>\u003cdiv>\u003cb>' + esc(CFG.settings.hqName) + '\u003c/b>\u003csmall>Final mission · Створення традиції · ' + CFG.settings.finalMinutes + ' хв\u003c/small>\u003c/div>\u003cspan class=\"st\">' + (S.finalDone ? '✓' : nx === NC ? 'next' : '') + '\u003c/span>\u003c/li>';\n};\nV.map = () => {\n  const nx = nextStage();\n  return '\u003csection class=\"mapwrap\">\u003cdiv id=\"map\">\u003c/div>\u003caside class=\"itin\">\u003cdiv class=\"eyebrow\">Expedition route · 6 countries\u003c/div>\u003ch2>Маршрут експедиції\u003c/h2>'\n    + '\u003col data-soft=\"itin\">' + SOFT.itin() + '\u003c/ol>'\n    + (IS_HOST ? (nx \u003c NC ? '\u003cbutton class=\"btn gold\" onclick=\"act(\\'openStage\\',{stage:' + nx + '})\">Летимо: ' + esc(CFG.countries[nx].name) + ' ✈\u003c/button>'\n      : '\u003cbutton class=\"btn gold\" onclick=\"act(\\'openFinal\\')\">До штаб-квартири: фінальна місія ✈\u003c/button>') : '')\n    + '\u003c/aside>\u003c/section>';\n};\nlet MAP = null;\nAFTER.map = (isNew) => initMap(isNew);\nfunction arc(a, b) { // плавна дуга між двома точками, як маршрут літака\n  const pts = [], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;\n  const dx = b[1] - a[1], dy = b[0] - a[0], k = 0.18;\n  const cx = mx + dx * k, cy = my - dy * k;\n  for (let t = 0; t \u003c= 1.0001; t += 0.04) pts.push([(1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * cx + t * t * b[0], (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * cy + t * t * b[1]]);\n  return pts;\n}\nfunction initMap(animate) {\n  const el = $('#map');\n  if (!el || !window.L) return;\n  if (MAP) { try { MAP.remove(); } catch (e) {} MAP = null; }\n  const hq = CFG.settings.hq;\n  const raw = [hq].concat(CFG.countries.map(c => c.ll)).concat([hq]);\n  const U = []; let prev = null; // «розгортаємо» довготу, щоб маршрут ішов навколо світу\n  raw.forEach(p => { let lng = p[1]; if (prev !== null) { while (lng - prev > 180) lng -= 360; while (lng - prev \u003c -180) lng += 360; } U.push([p[0], lng]); prev = lng; });\n  MAP = L.map(el, { zoomControl: false, zoomSnap: 0.1, scrollWheelZoom: false, worldCopyJump: false, attributionControl: true });\n  const nx = nextStage(); const arcs = [];\n  for (let k = 0; k \u003c U.length - 1; k++) {\n    const pts = arc(U[k], U[k + 1]); arcs.push(pts);\n    const done = k \u003c NC ? S.completed.indexOf(k) >= 0 : S.finalDone;\n    L.polyline(pts, done ? { color: '#D8BE8C', weight: 3, opacity: .95 } : { color: '#F4EFE5', weight: 1.6, opacity: .35, dashArray: '4 8' }).addTo(MAP);\n  }\n  const icon = (html) => L.divIcon({ className: '', html, iconSize: [0, 0] });\n  L.marker(U[0], { icon: icon('\u003cdiv class=\"mk hq\">\u003cdiv class=\"pin\">🌍\u003c/div>\u003cb>HQ · start\u003c/b>\u003c/div>') }).addTo(MAP);\n  L.marker(U[U.length - 1], { icon: icon('\u003cdiv class=\"mk hq ' + (nx === NC ? 'next' : '') + '\">\u003cdiv class=\"pin\">★\u003c/div>\u003cb>' + esc(CFG.settings.hqName) + '\u003c/b>\u003c/div>') }).addTo(MAP);\n  CFG.countries.forEach((c, i) => {\n    const cls = S.completed.indexOf(i) >= 0 ? 'done' : i === nx ? 'next' : 'todo';\n    const m = L.marker(U[i + 1], { icon: icon('\u003cdiv class=\"mk ' + cls + '\">\u003cdiv class=\"pin\">\u003cimg src=\"https://flagcdn.com/w80/' + c.code + '.png\">\u003c/div>\u003cb>0' + (i + 1) + ' · ' + esc(c.name) + '\u003c/b>\u003c/div>') }).addTo(MAP);\n    if (IS_HOST) m.on('click', () => act('openStage', { stage: i }));\n  });\n  const B = L.latLngBounds(U).pad(0.12);\n  MAP.fitBounds(B);\n  // контури країн малюємо трохи згодом, коли карта вже розмістилась на екрані (інакше Leaflet падає)\n  const thisMap = MAP;\n  setTimeout(() => { if (MAP === thisMap) drawWorld(thisMap); }, 60);\n  [80, 400].forEach(ms => setTimeout(() => { if (MAP) { try { MAP.invalidateSize(); MAP.fitBounds(B); } catch (e) {} } }, ms));\n  if (animate && arcs[nx]) flyPlane(arcs[nx]);\n}\n/* Власна карта світу: контури країн (Natural Earth) у кольорах гри, без сторонніх ключів */\nlet WORLD = null;\nconst ROUTE_IDS = ['276', '352', '484', '392', '036', '380', '804'];\nfunction drawWorld(map) {\n  const paint = () => {\n    if (map !== MAP || !WORLD) return;\n    [0, -360].forEach(off => {\n      const shifted = off ? JSON.parse(JSON.stringify(WORLD), (k, v) => (k === 'coordinates' ? shiftCoords(v, off) : v)) : WORLD;\n      L.geoJSON(shifted, {\n        interactive: false,\n        style: f => ROUTE_IDS.indexOf(String(f.id)) >= 0\n          ? { color: '#D8BE8C', weight: 1, fillColor: '#B99A66', fillOpacity: .38 }\n          : { color: 'rgba(216,190,140,.35)', weight: .6, fillColor: '#1f3a55', fillOpacity: .9 }\n      }).addTo(map).bringToBack();\n    });\n    for (let lat = -60; lat \u003c= 80; lat += 20) L.polyline([[lat, -400], [lat, 60]], { color: '#B99A66', weight: .5, opacity: .15, dashArray: '2 6', interactive: false }).addTo(map);\n    for (let lng = -400; lng \u003c= 60; lng += 30) L.polyline([[-80, lng], [85, lng]], { color: '#B99A66', weight: .5, opacity: .12, dashArray: '2 6', interactive: false }).addTo(map);\n  };\n  if (WORLD) return paint();\n  loadWorld().then(paint);\n}\nlet worldPromise = null;\nfunction loadWorld() {\n  if (!worldPromise) worldPromise = fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r => r.json()).then(topo => {\n    WORLD = topojson.feature(topo, topo.objects.countries);\n    // прибираємо Антарктиду, а Росію й Фіджі «склеюємо» через лінію зміни дат, щоб не було горизонтальних смуг\n    WORLD.features = WORLD.features.filter(f => String(f.id) !== '010');\n    WORLD.features.forEach(f => { if (['643', '242'].indexOf(String(f.id)) >= 0) f.geometry.coordinates = unwrapCoords(f.geometry.coordinates); });\n  }).catch(() => { worldPromise = null; });\n  return worldPromise;\n}\nfunction unwrapCoords(v) { return typeof v[0] === 'number' ? [v[0] \u003c -150 ? v[0] + 360 : v[0], v[1]] : v.map(unwrapCoords); }\nfunction shiftCoords(v, off) { return typeof v[0] === 'number' ? [v[0] + off, v[1]] : v.map(x => shiftCoords(x, off)); }\nfunction flyPlane(pts) { // літачок пролітає до наступної зупинки\n  // літачок-картинка дивиться носом угору; повертаємо його за напрямком польоту\n  const PLANE_SVG = '\u003csvg viewBox=\"0 0 24 24\">\u003cpath fill=\"#F4EFE5\" stroke=\"#142536\" stroke-width=\".6\" d=\"M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z\"/>\u003c/svg>';\n  const pl = L.marker(pts[0], { icon: L.divIcon({ className: '', html: '\u003cdiv class=\"plane\">' + PLANE_SVG + '\u003c/div>', iconSize: [0, 0] }), interactive: false }).addTo(MAP);\n  const t0 = performance.now(), dur = 3600;\n  let ang = null;\n  const aim = (a, b) => { // кут на екрані від точки a до точки b\n    const p1 = MAP.latLngToContainerPoint(a), p2 = MAP.latLngToContainerPoint(b);\n    if (Math.abs(p2.x - p1.x) + Math.abs(p2.y - p1.y) \u003c 0.5) return;\n    ang = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI + 90;\n    const svg = pl.getElement() && pl.getElement().querySelector('svg');\n    if (svg) svg.style.transform = 'rotate(' + ang.toFixed(1) + 'deg)';\n  };\n  aim(pts[0], pts[Math.min(1, pts.length - 1)]);\n  (function step(t) {\n    if (!MAP) return;\n    const f = Math.min(1, (t - t0) / dur), e = f \u003c .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;\n    const idx = e * (pts.length - 1), i = Math.floor(idx), r = idx - i, a = pts[i], b = pts[Math.min(i + 1, pts.length - 1)];\n    pl.setLatLng([a[0] + (b[0] - a[0]) * r, a[1] + (b[1] - a[1]) * r]);\n    if (i \u003c pts.length - 1) aim(a, b);\n    if (f \u003c 1) requestAnimationFrame(step);\n  })(t0);\n}\n\n/* ---------- 04 Країна ---------- */\nV.destination = () => {\n  const c = CFG.countries[S.stage]; if (!c) return V.loading();\n  return '\u003csection class=\"dest\">\u003cdiv class=\"dest-hero\" style=\"background-image:url(\\'' + c.photo + '\\')\">\u003cdiv class=\"dest-shade\">\u003c/div>\u003cdiv class=\"dest-head\">'\n    + '\u003cdiv class=\"eyebrow\">Stop 0' + (S.stage + 1) + ' of 0' + NC + ' · ' + c.ll.map(x => x.toFixed(2)).join('°, ') + '°\u003c/div>'\n    + '\u003cdiv class=\"dest-flag\" style=\"margin-top:14px\">' + flag(c.code, 84) + '\u003c/div>'\n    + '\u003ch1 class=\"title\">' + esc(c.name) + '\u003c/h1>\u003cdiv class=\"subtitle\">' + esc(c.stop) + '\u003c/div>'\n    + '\u003cdiv class=\"chips\">\u003cspan class=\"chip\">🎯 ' + esc(c.kind) + '\u003c/span>\u003cspan class=\"chip\">⏱ ' + c.minutes + ' хв\u003c/span>\u003cspan class=\"chip\">🛂 ' + esc(c.stamp) + '\u003c/span>\u003c/div>\u003c/div>\u003c/div>'\n    + '\u003cdiv class=\"dest-body\">'\n    + '\u003carticle class=\"card paper\">\u003ch3>Welcome to ' + esc(c.name) + '!\u003c/h3>\u003cp>' + esc(c.story) + '\u003c/p>\u003c/article>'\n    + '\u003carticle class=\"card\">\u003ch3>🎄 Традиції\u003c/h3>\u003cp>' + esc(c.tradition) + '\u003c/p>\u003c/article>'\n    + '\u003carticle class=\"card\">\u003ch3>✨ Цікавий фак .trim()).length : 0; }\nfunction tradCard(t, f, extra) {\n  f = f || {};\n  const sym = f.symbol || '✦';\n  return '\u003cdiv class=\"postcard\" id=\"pc-' + t.id + '\">\u003cdiv class=\"pc-k\">A Christmas tradition by ' + esc(t.name) + '\u003c/div>'\n    + '\u003cdiv class=\"sym\">' + esc(emojiOf(sym)) + '\u003c/div>\u003ch3>' + esc(f.name || 'Назва традиції…') + '\u003c/h3>'\n    + '\u003cdiv class=\"desc\">' + esc(f.desc || 'Опис з\\'явиться тут.') + '\u003c/div>'\n    + '\u003col>' + [f.r1, f.r2, f.r3].map(x => '\u003cli>' + esc(x || '…') + '\u003c/li>').join('') + '\u003c/ol>'\n    + '\u003cdiv class=\"meta\">\u003cdiv>\u003cb>Коли\u003c/b>' + esc(f.when || '—') + '\u003c/div>\u003cdiv>\u003cb>Символ\u003c/b>' + esc(sym) + '\u003c/div>\u003c/div>'\n    + (f.why ? '\u003cdiv class=\"by\">«' + esc(f.why) + '»\u003c/div>' : '')\n    + '\u003cdiv class=\"postmark\">CHRISTMAS\u003cbr>HQ\u003cbr>★ ' + YEAR + ' ★\u003c/div>' + (extra || '') + '\u003c/div>';\n}\nSOFT.finalProg = () => S.teams.map(t => { const n = filled(FIN[t.id]); return '\u003cdiv class=\"tcard\" style=\"--c:' + t.color + '\">\u003ch3>' + esc(t.name) + '\u003c/h3>\u003cdiv class=\"hint\">' + (n === 8 ? '✓ традиція готова' : '✍ заповнено ' + n + ' з 8') + '\u003c/div>\u003cdiv class=\"prog\">\u003ci style=\"width:' + n / 8 * 100 + '%\">\u003c/i>\u003c/div>\u003c/div>'; }).join('');\nV.final = () => {\n  const head = '\u003cdiv class=\"ch-head\">\u003cspan style=\"font-size:52px\">🌍\u003c/span>\u003cdiv>\u003cdiv class=\"eyebrow\">Final destination · ' + esc(CFG.settings.hqName) + '\u003c/div>\u003ch2>Our Christmas, Our Traditions\u003c/h2>\u003c/div>\u003cdiv class=\"qcount\">\u003c/div>' + timerRing() + '\u003c/div>';\n  const intro = '\u003cdiv class=\"card paper\" style=\"margin-bottom:22px\">\u003ch3>Mission: Create Your Own Christmas Tradition\u003c/h3>\u003cp>Ви повернулися до штаб-квартири, але в команди досі немає власної новорічної традиції. Придумайте таку, яку вся команда захоче повторювати
